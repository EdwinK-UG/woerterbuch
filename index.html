    <h3>${r.ok?'Richtig!':r.ok===null?'Stimme gezählt':r.answered?'Leider falsch':'Zeit abgelaufen'}</h3>
    ${r.ok?`<div class="pts">+${fmt(r.pts)}</div>`:''}${r.streak>=2?`<div class="gstreak">🔥 ${r.streak} richtig in Folge</div>`:''}
    ${r.ok===false&&p.right?`<div class="ans">Richtig ist: <b>${H(p.right)}</b></div>`:''}</div>
    <h2>Platz ${r.rank} <span style="opacity:.6;font-size:1rem">von ${r.of}</span></h2>
    <p>${r.ahead?`${fmt(r.ahead.gap)} Punkte hinter ${H(r.ahead.name)}`:'Du führst! 🏆'}</p>`));
}
function pEnd(p){ if(!G||G.mode!=='player'||!G.joined)return; alive(); clearTimers();
  const r=p.res&&p.res[G.pid];
  if(!r){pWait();return}
  const medal=['🥇','🥈','🥉'][r.rank-1]||'🎉';
  const tr=p.teams&&r.team?p.teams.findIndex(t=>t.k===r.team)+1:0;
  gin(center(`<div class="gme">${medal}</div><h2>Platz ${r.rank} von ${r.of}</h2><div class="gbig">${fmt(r.score)}<small>Punkte</small></div>
    <div class="gstats"><div><b>${r.ok}</b><span>richtig</span></div>${tr?`<div><b>${tr}.</b><span>Team ${TEAMS[r.team-1][0]}</span></div>`:''}</div>
    <p style="opacity:.75">Bleib hier – vielleicht startet gleich eine neue Runde.</p>`));
  AU.sfx(r.rank<=3?'fanfare':'place'); if(r.rank<=3)confetti();
}

/* ---------- MEMORY: find word + meaning pairs ---------- */
function memoryStart(s){
  const pool=poolFor(s).filter(i=>{const g=qGloss(E[i]);return g&&g.length<=75&&!g.includes('___')});
  const pairs=Math.min(s.pairs||6,pool.length);
  stage('Memory');
  if(pairs<3){gin(center(`<h2>Zu wenige Wörter</h2><p>Für Memory brauchst du mindestens 3 Wörter mit kurzer Bedeutung.</p><a class="gbtn" href="#/play/memory">Zurück</a>`));return}
  const pick=sample(pool,pairs), cards=shuffle(pick.flatMap((i,k)=>[{k,w:1,t:plainW(E[i].w),i},{k,w:0,t:qGloss(E[i]),i}]));
  G={mode:'memory',kind:'memory',s,cards,open:[],done:0,moves:0,t0:Date.now(),pairs,lock:false};
  gin(`<div class="gmem" id="gmem">${cards.map((c,j)=>`<button class="gcd" data-j="${j}"><div class="in"><div class="fa">${ic('sparkles')}</div><div class="ba ${c.w?'w':''}">${H(c.t)}</div></div></button>`).join('')}</div>`);
  G.clock=setInterval(memScore,1000); memScore(); AU.play('calm');
  document.querySelectorAll('#gmem .gcd').forEach(b=>b.onclick=()=>memFlip(+b.dataset.j,b));
}
function memScore(){ if(!G||G.mode!=='memory')return; setScore(`<span class="gscore">${G.done}/${G.pairs}<small>${G.moves} Züge · ${Math.round((Date.now()-G.t0)/1000)} s</small></span>`) }
function memFlip(j,b){
  if(G.lock||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up'); AU.sfx('flip'); G.open.push([j,b]);
  if(G.open.length<2)return;
  G.moves++; const [[j1,b1],[j2,b2]]=G.open; G.open=[];
  if(G.cards[j1].k===G.cards[j2].k&&G.cards[j1].w!==G.cards[j2].w){
    later(()=>{b1.classList.add('done');b2.classList.add('done');AU.sfx('ok')},250); G.done++;
    if(G.done===G.pairs)later(memEnd,900);
  }else{ G.lock=true; later(()=>{b1.classList.add('bad');b2.classList.add('bad')},300);
    later(()=>{[b1,b2].forEach(x=>x.classList.remove('up','bad'));G.lock=false},1150) }
  memScore();
}
function memEnd(){
  clearInterval(G.clock); AU.stop(); const sec=Math.round((Date.now()-G.t0)/1000), key='mem|'+setupKey(G.s), best=LS.get('gd_gbest',{}), prev=best[key];
  const stars=G.moves<=G.pairs*1.5?3:G.moves<=G.pairs*2.2?2:1, rec=!prev||sec<prev.sec;
  if(rec){best[key]={sec,moves:G.moves};LS.set('gd_gbest',best)}
  AU.sfx('fanfare'); confetti();
  gin(center(`<h2>Alle Paare gefunden!</h2><div class="gbig" style="font-size:3rem">${'⭐'.repeat(stars)}</div>
    <div class="gstats"><div><b>${G.moves}</b><span>Züge</span></div><div><b>${sec} s</b><span>Zeit</span></div><div><b>${prev?Math.min(prev.sec,sec):sec} s</b><span>Bestzeit</span></div></div>
    <div class="gmiss"><h4>Deine Wörter</h4>${[...new Set(G.cards.map(c=>c.i))].map(i=>`<a href="#/w/${encodeURIComponent(E[i].w)}"><b>${H(plainW(E[i].w))}</b> – ${H(qGloss(E[i]))}</a>`).join('')}</div>
    <div class="row" style="justify-content:center;gap:.5rem"><button class="gbtn" onclick="PLAY.again()">${ic('rotate-ccw')} Nochmal</button><a class="gbtn ghost" href="#/play">Andere Spiele</a></div>`));
  G.mode='memory-end';
}

  stage('Artikel-Blitz');
  if(pool.length<5){gin(center(`<h2>Zu wenige Nomen</h2><p>Wähle eine Auswahl mit mehr Nomen.</p><a class="gbtn" href="#/play/blitz">Zurück</a>`));return}
  G={mode:'blitz',kind:'blitz',s,pool,score:0,streak:0,mult:1,ok:0,bad:0,miss:[],cur:null,end:0,dur:60,last:-1};
  gin(center(`<h2>Artikel-Blitz</h2><p>60 Sekunden: Tippe für jedes Wort den richtigen Artikel.<br>Fünf richtige hintereinander erhöhen deinen Multiplikator.</p>
    <button class="gbtn" id="gbgo">${ic('zap')} Start</button>`));

function blitzCount(k){ if(!G||G.mode!=='blitz')return; if(!k)return blitzRun();
  gin(center(`<div class="gready"><div class="gnum">${k}</div></div>`)); AU.sfx('beep'); later(()=>blitzCount(k-1),800) }
function blitzRun(){
  AU.sfx('go'); AU.play('think'); G.end=Date.now()+G.dur*1000;
  gin(`<div class="gbl"><div class="gtimer" style="width:100%"><i style="animation-duration:${G.dur}s"></i></div>
    <div class="row" style="justify-content:space-between;width:100%"><span class="gmult" id="gbm">×1</span><span class="gbig" id="gbs" style="font-size:1.8rem">0</span></div>
    <div class="gblw" id="gbw"></div>
    <div class="gblb">${['der','die','das'].map(a=>`<button class="gt ${a}" data-a="${a}">${a}</button>`).join('')}</div></div>`);
  document.querySelectorAll('.gblb .gt').forEach(b=>b.onclick=()=>blitzAns(b.dataset.a));
  G.keys=ev=>{const m={1:'der',2:'die',3:'das',j:'der',k:'die',l:'das'}[ev.key]; if(m)blitzAns(m)}; document.addEventListener('keydown',G.keys);
  blitzWord(); later(blitzEnd,G.dur*1000);
}
function blitzWord(){ let i; do{i=G.pool[rnd(G.pool.length)]}while(G.pool.length>1&&i===G.last); G.last=i; G.cur=E[i]; const w=$('gbw'); if(w)w.textContent=plainW(G.cur.w) }
function blitzAns(a){
  if(!G||G.mode!=='blitz'||Date.now()>G.end)return;
  const e=G.cur, w=$('gbw');
  if(a===e.ar){G.ok++;G.streak++;G.mult=Math.min(4,1+Math.floor(G.streak/5));G.score+=10*G.mult;AU.sfx('ok');w.className='gblw okp'}
  else{G.bad++;G.streak=0;G.mult=1;G.miss.push(e.i);AU.sfx('bad');w.className='gblw shake';w.textContent=`${e.ar} ${plainW(e.w)}`;
    $('gbm').textContent='×1'; $('gbs').textContent=G.score; document.querySelectorAll('.gblb .gt').forEach(b=>b.disabled=true);
    later(()=>{document.querySelectorAll('.gblb .gt').forEach(b=>b.disabled=false);w.className='gblw';blitzWord()},900);return}
  void w.offsetWidth; $('gbm').textContent='×'+G.mult; $('gbs').textContent=G.score; blitzWord();
}
function blitzEnd(){
  if(!G||G.mode!=='blitz')return; document.removeEventListener('keydown',G.keys); AU.stop();
  const key='blitz|'+setupKey(G.s), best=LS.get('gd_gbest',{}), prev=best[key], rec=!prev||G.score>prev.score;
  if(rec){best[key]={score:G.score};LS.set('gd_gbest',best)}
  AU.sfx('fanfare'); if(rec&&G.score>0)confetti();
  G.miss=[...new Set(G.miss)];
  gin(center(`<h2>${rec&&prev?'Neuer Rekord!':'Zeit um!'}</h2><div class="gbig">${G.score}<small>Punkte</small></div>
    <div class="gstats"><div><b>${G.ok}</b><span>richtig</span></div><div><b>${G.bad}</b><span>falsch</span></div><div><b>${prev?Math.max(prev.score,G.score):G.score}</b><span>Rekord</span></div></div>
    ${G.miss.length?`<div class="gmiss"><h4>Diese Artikel merken</h4>${G.miss.map(i=>`<a href="#/w/${encodeURIComponent(E[i].w)}"><b>${E[i].ar} ${H(plainW(E[i].w))}</b></a>`).join('')}</div>
      <button class="gbtn ghost" onclick="PLAY.saveMiss()">${ic('list-plus')} In Liste „Aus Spielen" speichern</button>`:''}
    <div class="row" style="justify-content:center;gap:.5rem"><button class="gbtn" onclick="PLAY.again()">${ic('rotate-ccw')} Nochmal</button><a class="gbtn ghost" href="#/play">Andere Spiele</a></div>`));
  G.miss=G.miss.map(i=>E[i].w); G.mode='blitz-end';
}

function leave(){

  if(G){ clearInterval(G.hb); clearInterval(G.sec); clearInterval(G.watch); clearInterval(G.clock); if(G.keys)document.removeEventListener('keydown',G.keys);
    if(G.mode==='host'&&G.ch)send('bye',{}); if(G.mode==='player'&&G.ch)send('leave',{pid:G.pid}); closeCh() }
  G=null; document.body.classList.remove('ingame');
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
function quit(){
  if(G&&G.mode==='host'&&G.phase!=='end'&&G.players&&G.players.size&&!confirm('Spiel für alle beenden?'))return;
  if(G&&G.mode==='player'&&G.joined&&!confirm('Spiel verlassen?'))return;
  leave(); go('play');
}
function view(arg){
  if(!E.length){V().innerHTML='<div class="loading"><div class="spin"></div>Wörterbuch wird geladen …</div>';return}
  const [a,b]=(arg||'').split('/');
  if(G&&!(a==='join'&&G.mode==='player'))leave();
  if(a==='gram'){const st=LS.get('gd_gset_solo',{}); if(st.src!=='gram'){st.src='gram';st.id='1'} LS.set('gd_gset_solo',st); viewSetup('solo')}
  else if(a==='solo'||a==='host'||a==='memory'||a==='blitz')viewSetup(a);
  else if(a==='join')joinForm((b||'').replace(/\D/g,'').slice(0,6));
  else if(a==='quizzes')viewQuizzes();
  else if(a==='edit')viewEdit(b);
  else viewHub();
}
document.addEventListener('keydown',ev=>{
  if(!G||G.mode!=='host'||ev.target.closest('input,textarea,select'))return;
  if(ev.key===' '||ev.key==='Enter'){const b=$('gnext')||$('gstart'); if(b&&!b.disabled){ev.preventDefault();b.click()}}
});
window.addEventListener('beforeunload',()=>{ if(G&&G.mode==='host'&&G.ch)send('bye',{}) });

window.PLAY={view,leave,quit,again,saveMiss,kick,hostGo,hostNext,hostEnd,hostScores,report,csv,rematch,playQuiz,newQuiz,
  snd(){AU.wake();AU.set(!AU.on);const b=$('gmsnd');if(b){b.innerHTML=ic(AU.on?'volume-2':'volume-x');drawIcons()}},
  fs(){const m=$('gm'); if(!m)return; if(document.fullscreenElement)document.exitFullscreen(); else if(m.requestFullscreen)m.requestFullscreen().catch(()=>{})},
  qeAdd:QE.add,qeRm:QE.rm,qeOpt:QE.opt,qeSet:QE.set,qeType:QE.type,qeSave:QE.save,qeDel:QE.del,
  _test:{buildQs,qGloss,judge,poolFor,AU}};

/* nav tab */
const tabs=document.getElementById('tabs');
if(tabs&&!tabs.querySelector('[data-t="play"]')){const a=document.createElement('a');a.href='#/play';a.dataset.t='play';a.title='Spiele';a.innerHTML='<i data-lucide="gamepad-2" class="lic"></i><span>Spiele</span>';tabs.appendChild(a);drawIcons()}
})();
</script>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wörterbuch</title>
<meta name="description" content="German learner dictionary with categories, revision lists, word maps and Anki-style flashcards.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --card:#ffffff; --fg:#20242b; --mut:#6b7482; --faint:#9aa3b0;
  --line:#e7e2d7; --line2:#efeadf; --ac:#1f6feb; --ac-salt:#e9f1ff; --shadow:0 1px 2px rgba(20,24,32,.05),0 8px 24px rgba(20,24,32,.06);
  --der:#2563eb; --die:#e11d48; --das:#0f9d6b; --neu:#8b5cf6;
  --der-s:#e5edff; --die-s:#fde7ee; --das-s:#e2f6ee; --neu-s:#efeaff;
  --ok:#0f9d6b; --warn:#e4860a; --bad:#e11d48;
}
:root[data-theme="dark"], html:not([data-theme="light"]) {}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --panel:#141a22; --card:#171e27; --fg:#e8ecf2; --mut:#9aa6b4; --faint:#6b7684;
  --line:#242d39; --line2:#1d2531; --ac:#6ea8fe; --ac-salt:#17273f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --der:#6ea8fe; --die:#f4789b; --das:#4cd0a0; --neu:#b49bff;
  --der-s:#16233a; --die-s:#361824; --das-s:#122b22; --neu-s:#231b3d;
}}
:root[data-theme="dark"]{
  --bg:#0f1319; --panel:#141a22; --card:#171e27; --fg:#e8ecf2; --mut:#9aa6b4; --faint:#6b7684;
  --line:#242d39; --line2:#1d2531; --ac:#6ea8fe; --ac-salt:#17273f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --der:#6ea8fe; --die:#f4789b; --das:#4cd0a0; --neu:#b49bff;
  --der-s:#16233a; --die-s:#361824; --das-s:#122b22; --neu-s:#231b3d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:60rem;margin:0 auto;padding:0 1rem}
/* top bar */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.8rem;height:58px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand b{color:var(--ac)}
nav.tabs{display:flex;gap:.2rem;margin-left:auto;overflow:auto}
nav.tabs a{font-size:.84rem;font-weight:600;color:var(--mut);text-decoration:none;padding:.45rem .7rem;border-radius:.55rem;white-space:nowrap}
nav.tabs a.on{color:var(--fg);background:var(--ac-salt)}
nav.tabs a:hover{color:var(--fg)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--mut);width:38px;height:38px;border-radius:.6rem;display:grid;place-items:center;font-size:1rem}
main{padding:1.4rem 0 5rem}
h1.page{font-family:Fraunces,serif;font-weight:600;font-size:1.7rem;letter-spacing:-.02em;margin:.2rem 0 1rem}
.sub{color:var(--mut);font-size:.92rem;margin:-.6rem 0 1.3rem}
/* search */
.searchbox{position:relative;margin:.4rem 0 1.1rem}
#q{width:100%;font-family:Newsreader,serif;font-size:1.5rem;padding:.95rem 3rem .95rem 1.1rem;border:1.5px solid var(--line);border-radius:1rem;background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
#q:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-salt)}
.searchbox .mag{position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:var(--faint);font-size:1.2rem;pointer-events:none}
#sug{position:absolute;left:0;right:0;top:calc(100% + .35rem);background:var(--card);border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);z-index:30;overflow:hidden;max-height:62vh;overflow-y:auto}
#sug li{list-style:none;display:flex;align-items:baseline;gap:.6rem;padding:.55rem .95rem;cursor:pointer}
#sug li .hw{font-family:Newsreader,serif;font-size:1.08rem}
#sug li small{margin-left:auto;color:var(--faint);font-size:.74rem}
#sug li.on,#sug li:hover{background:var(--ac-salt)}
.gdot{width:.5rem;height:.5rem;border-radius:50%;flex:0 0 auto;align-self:center}
/* entry card */
.entry{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;box-shadow:var(--shadow);padding:1.3rem 1.4rem;margin:0 0 1.1rem;position:relative}
.entry .top{display:flex;align-items:flex-start;gap:.7rem;flex-wrap:wrap}
.hw{font-family:Fraunces,serif;font-weight:600;font-size:2.1rem;line-height:1.1;letter-spacing:-.02em}
.hw .syl{color:var(--faint);font-weight:400}
.art{font-family:Fraunces,serif;font-weight:600;font-size:1.15rem;padding:.12rem .55rem;border-radius:.5rem;align-self:center}
.art.der{color:var(--der);background:var(--der-s)} .art.die{color:var(--die);background:var(--die-s)} .art.das{color:var(--das);background:var(--das-s)}
.pos{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);padding:.18rem .45rem;border-radius:.4rem;align-self:center}
.pg{margin-left:auto;align-self:center;color:var(--faint);font-size:.72rem;font-weight:600}
.def{font-family:Newsreader,serif;font-size:1.12rem;line-height:1.62;margin:.85rem 0 0;color:var(--fg)}
.def b{font-weight:600;color:var(--fg)}
.def i.g{font-style:italic;color:var(--die);font-size:.96em}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:.82rem;font-weight:600;padding:.5rem .8rem;border-radius:.6rem;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.sm{font-size:.76rem;padding:.35rem .6rem}
/* word map */
.wmap{margin-top:1.15rem;border-top:1px dashed var(--line);padding-top:1rem}
.wmap h4{margin:0 0 .3rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.wmap > svg{width:100%;height:auto;display:block;overflow:visible}.wmpop svg.lic,.wmpop .lic{width:1em;height:1em;display:inline-block}
.wmap .node text{font-family:Inter,sans-serif;font-weight:600}
.wmap .node:hover circle{filter:brightness(1.07)}
.wmap .cn text{font-family:Fraunces,serif}
/* grids */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.75rem}
.ccard{border:1px solid var(--line);border-radius:.95rem;padding:.9rem;background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:.35rem;position:relative;overflow:hidden}
.ccard .emo{font-size:1.5rem}
.ccard .cl{font-weight:700;font-size:.95rem;line-height:1.2}
.ccard .cc{font-size:.76rem;color:var(--mut);font-weight:600}
.ccard .stripe{position:absolute;left:0;top:0;bottom:0;width:5px}
.ccard:hover{transform:translateY(-1px);border-color:var(--ac)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.5rem}
.wrow{display:flex;align-items:center;gap:.55rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:.6rem;background:var(--card);cursor:pointer;text-decoration:none;color:inherit}
.wrow:hover{border-color:var(--ac);background:var(--ac-salt)}
.wrow .hw{font-family:Newsreader,serif;font-size:1.05rem}
.wrow .chk{margin-left:auto}
/* lists & decks */
.panelcard{background:var(--card);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);padding:1rem 1.1rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit}
.panelcard:hover{border-color:var(--ac)}
.panelcard .big{font-weight:700;font-size:1.05rem}
.panelcard .meta{color:var(--mut);font-size:.8rem}
.panelcard .ic{width:44px;height:44px;border-radius:.7rem;display:grid;place-items:center;font-size:1.3rem;background:var(--ac-salt);flex:0 0 auto}
.empty{text-align:center;color:var(--mut);padding:3rem 1rem;border:1.5px dashed var(--line);border-radius:1rem}
.empty .em{font-size:2.2rem;display:block;margin-bottom:.4rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.input{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:.55rem .8rem;border-radius:.6rem;font-size:.95rem}
.input:focus{outline:none;border-color:var(--ac)}
.toolbar{position:sticky;top:58px;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:.6rem 0;margin-bottom:.4rem;border-bottom:1px solid var(--line2)}
/* study */
.study{max-width:40rem;margin:0 auto}
.stwrap{min-height:58vh;display:flex;flex-direction:column}
.counts{display:flex;gap:1.1rem;justify-content:center;margin:.4rem 0 1rem;font-weight:700;font-size:.9rem}
.counts .n{color:var(--neu)} .counts .l{color:var(--die)} .counts .r{color:var(--das)}
.flashcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:1.2rem;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.4rem;min-height:40vh}
.flashcard .fhw{font-family:Fraunces,serif;font-weight:600;font-size:2.6rem;letter-spacing:-.02em}
.flashcard .fart{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin-bottom:.2rem}
.flashcard .fdef{font-family:Newsreader,serif;font-size:1.12rem;line-height:1.6;margin-top:1rem;max-width:34rem;color:var(--fg)}
.flashcard hr{width:60%;border:none;border-top:1px solid var(--line);margin:1.1rem 0}
.tap{color:var(--faint);font-size:.8rem;margin-top:1.2rem}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.9rem}
.grade{border:none;border-radius:.7rem;padding:.7rem .3rem;color:#fff;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;gap:.1rem;line-height:1.1}
.grade small{font-weight:600;font-size:.66rem;opacity:.9}
.g-again{background:var(--bad)} .g-hard{background:var(--warn)} .g-good{background:var(--das)} .g-easy{background:var(--ac)}
.done{text-align:center;padding:3rem 1rem}
.done .em{font-size:3rem}
/* toast & modal */
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(2rem);background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:.7rem;font-weight:600;font-size:.86rem;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;place-items:center;z-index:70;padding:1rem}
.modal.show{display:grid}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);width:min(26rem,100%);padding:1.2rem}
.sheet h3{margin:0 0 .3rem;font-family:Fraunces,serif;font-weight:600}
.sheet p{margin:0 0 1rem;color:var(--mut);font-size:.88rem}
.listpick{max-height:12rem;overflow:auto;margin:.4rem 0}
.listpick .lp{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:.55rem;cursor:pointer}
.listpick .lp:hover{background:var(--ac-salt)}
.loading{text-align:center;color:var(--mut);padding:4rem 1rem}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--mut)}
.pill{font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:1rem;background:var(--ac-salt);color:var(--ac)}
.def .sn,.fdef .sn,.def .kb,.fdef .kb,.def .sb,.fdef .sb,.def .ib,.fdef .ib{display:inline-grid;place-items:center;min-width:1.35em;height:1.35em;padding:0 .25em;border-radius:.3em;font:700 .7em/1 Inter,system-ui,sans-serif;vertical-align:.15em;margin:0 .12em}
.def .sn,.fdef .sn{background:var(--ac);color:#fff}
.def .kb,.fdef .kb{background:var(--mut);color:var(--bg)}
.def .sb,.fdef .sb,.def .ib,.fdef .ib{background:var(--ac-salt);color:var(--ac)}
.def .ib,.fdef .ib{font-family:Georgia,serif;font-style:italic}
.def .sq,.fdef .sq{display:inline-block;width:.5em;height:.5em;background:var(--ac);vertical-align:.12em;margin:0 .15em}
.def .core,.fdef .core{color:var(--ac)}
.def small,.fdef small{font-size:.72em;letter-spacing:.05em;color:var(--mut);font-family:Inter,system-ui,sans-serif}
.wimg{display:none}.wimg.on{display:block;float:right;width:min(42%,270px);margin:.6rem 0 .6rem 1.1rem}
.wimg figure{margin:0}.wimg img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:var(--panel);border:1px solid var(--line);border-radius:.8rem}
.wimg figcaption{font-size:.7rem;color:var(--faint);margin-top:.35rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}.imgnext{border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:.72rem;font-weight:600;padding:.25rem .55rem;border-radius:.5rem}.imgnext:hover{color:var(--ac);border-color:var(--ac)}.wimg figcaption a{color:inherit}
.entry .say{align-self:center;width:34px;height:34px;font-size:.95rem}.entry::after{content:"";display:block;clear:both}
.wmap{clear:both}.wmleg{display:flex;flex-wrap:wrap;gap:.4rem 1rem;justify-content:center;font-size:.75rem;color:var(--mut);margin-top:.3rem}
.wmleg i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.35rem;vertical-align:-.05em}
.wmnote{font-size:.7rem;color:var(--faint);text-align:center;margin:.35rem 0 0}
@media(max-width:560px){.wimg.on{float:none;width:100%;margin:.7rem 0}.wimg img{height:auto}}

/* ===== redesign ===== */
html{background:var(--bg)}body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--ac) 7%,transparent),transparent 70%) no-repeat,var(--bg)}
.lic{width:1em;height:1em;display:inline-block;vertical-align:-.14em}
svg.lic{stroke-width:1.8}
header .brand{display:flex;align-items:center;gap:.5rem}
header .logo{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
nav.tabs a{border-radius:999px;padding:.42rem .85rem}
.hero{padding:1.6rem 0 .3rem}
.hero h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.06;letter-spacing:-.03em;margin:0}
.hero h1 em{font-style:italic;color:var(--ac);font-weight:500}
.hero p{color:var(--mut);margin:.7rem 0 0;font-size:1rem;max-width:34rem}
.searchbox{margin:1.4rem 0 1rem}
#q{border:1px solid var(--line);border-radius:1.1rem;padding:1.05rem 1.2rem 1.05rem 3.1rem;box-shadow:0 1px 2px rgba(20,24,32,.04),0 12px 32px -8px rgba(20,24,32,.12)}
.searchbox .mag{left:1.15rem;right:auto;color:var(--mut);font-size:1.25rem;display:flex}
#sug{border-radius:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 1.3rem}
.chipl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:.2rem}
.chip{font-family:Newsreader,serif;font-size:1rem;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);padding:.28rem .8rem;border-radius:999px}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.wotd{display:flex;gap:1rem;align-items:flex-start;text-decoration:none;color:inherit;border-radius:1.4rem;padding:1.4rem 1.5rem;margin:.4rem 0 .4rem;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 13%,var(--card)) 0%,var(--card) 62%);border:1px solid color-mix(in srgb,var(--ac) 22%,var(--line));box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.wotd:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,24,32,.05),0 18px 40px -12px rgba(20,24,32,.2)}
.wotd-l{flex:1;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ac)}
.wotd-w{display:flex;align-items:center;gap:.6rem;margin:.45rem 0 .2rem;flex-wrap:wrap}
.wotd-hw{font-family:Fraunces,serif;font-weight:600;font-size:clamp(2rem,5vw,2.6rem);letter-spacing:-.025em;line-height:1.1}
.wotd-hw .syl{color:var(--faint);font-weight:400}
.wotd-d{font-family:Newsreader,serif;font-size:1.12rem;line-height:1.5;margin:.3rem 0 .8rem;color:var(--fg);max-width:40rem}
.wotd-go{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;font-weight:600;color:var(--ac)}
.wotd-say{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ac);font-size:1.2rem;display:grid;place-items:center}
.wotd-say:hover{border-color:var(--ac)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:2.1rem 0 .9rem}
.sec h2{font-family:Fraunces,serif;font-weight:600;font-size:1.4rem;letter-spacing:-.02em;margin:0}
.sec a{display:inline-flex;align-items:center;gap:.3rem;font-size:.86rem;font-weight:600;color:var(--ac);text-decoration:none;white-space:nowrap}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.7rem}
.ccard{flex-direction:row;align-items:center;gap:.85rem;padding:.85rem .9rem .85rem .85rem;border-radius:1rem;box-shadow:0 1px 2px rgba(20,24,32,.04);transition:transform .15s,border-color .15s,box-shadow .15s}
.ccard .stripe,.ccard .emo{display:none}
.ccard:hover{transform:translateY(-2px);border-color:hsl(var(--h) 55% 70%);box-shadow:0 10px 26px -12px hsl(var(--h) 50% 40% / .35)}
.badge{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.25rem;
  background:color-mix(in srgb,hsl(var(--h) 75% 55%) 15%,var(--card));color:hsl(var(--h) 60% 38%)}
.badge.big{width:3.1rem;height:3.1rem;font-size:1.5rem;border-radius:.95rem}
.ctx{display:flex;flex-direction:column;min-width:0;flex:1}
.ccard .cl{font-size:.95rem;font-weight:600;line-height:1.25}
.ccard .cc{font-size:.76rem;font-weight:500;color:var(--faint)}
.chev{color:var(--faint);font-size:1rem;display:flex;transition:transform .15s}
.ccard:hover .chev{transform:translateX(2px);color:hsl(var(--h) 55% 45%)}
.cathead{display:flex;align-items:center;gap:.75rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:2.2rem 0 .4rem;padding:1.1rem 0 0;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:Fraunces,serif;font-weight:600;font-size:1.55rem;letter-spacing:-.02em}
.stats span{font-size:.78rem;color:var(--mut)}

<script id="data" type="application/octet-stream" data-src="core.bin?v=3846fea8f4" data-defs="defs.bin?v=db398139f0"></script>
<script>
"use strict";
/* ---------- storage helpers (safe) ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=864e5, now=()=>Date.now();
/* ---------- state ---------- */
let E=[], CATS=[], WIDX=new Map(), CATMAP=new Map();
let lists=LS.get('gd_lists',{}), decks=LS.get('gd_decks',{}), prefs=LS.get('gd_prefs',{});
function saveLists(){LS.set('gd_lists',lists)} function saveDecks(){LS.set('gd_decks',decks)} function savePrefs(){LS.set('gd_prefs',prefs)}
/* fold diacritics for search */
const fold=s=>s.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
let FOLD=[];
/* ---------- load packed data ---------- */
/* The website loads the dictionary in two parts: core.bin (~0.5 MB: headwords for search, topics, home page)
   first, then defs.bin (definitions, word families, word maps) in the background. Pages that show definitions
   wait for the second part (FULLP). The single-file copy has everything inside the page. */
let FULL=false, NMAIN=0, fullRes; const FULLP=new Promise(r=>fullRes=r);
async function fetchBin(url,progress){
  const r=await fetch(url); if(!r.ok)throw new Error('Wörterbuch-Daten: '+r.status);
  const total=+r.headers.get('content-length')||0, lo=progress&&document.querySelector('#view .loading:not([data-g])');
  let bin;
  if(r.body&&total&&lo){            // show how far the first download is (later visits come from the offline copy)
    const rd=r.body.getReader(), parts=[]; let got=0, last=-1;
    for(;;){const {done,value}=await rd.read(); if(done)break; parts.push(value); got+=value.length;
      const pc=Math.min(99,Math.floor(got/total*100)); if(pc!==last&&pc>0){last=pc; lo.lastChild.textContent='Wörterbuch wird geladen … '+pc+' %'}}
    bin=new Uint8Array(got); let o=0; for(const x of parts){bin.set(x,o); o+=x.length}
  } else bin=new Uint8Array(await r.arrayBuffer());
  return unpack(bin);
}
async function unpack(bin){
  const txt=bin[0]===0x1f&&bin[1]===0x8b
    ?await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
    :new TextDecoder().decode(bin);    // in case a server already unpacked it
  return JSON.parse(txt);
}
function setFull(){ FULL=true; fullRes() }
async function load(){
  const el=document.getElementById('data'), b64=el.textContent.trim();
  const aip=fetchAIEntries();          // AI entries load in parallel with the dictionary
  let j, defsP=null;
  if(b64){ j=await unpack(Uint8Array.from(atob(b64),c=>c.charCodeAt(0))) }   // single-file copy: data inside the page
  else{ j=await fetchBin(el.dataset.src,true); defsP=fetchBin(el.dataset.defs) }   // one after the other: on a slow line the small file is not slowed down
  CATS=j.c; CATS.forEach(c=>CATMAP.set(c.id,c));
  if(defsP){
    NMAIN=j.n;
    E=j.e.map((a,i)=>({i,w:a[0],sy:a[1],ar:a[2],ps:a[3],df:'',rel:[],cat:a[4],pg:a[5],wm:null,st:a[6]&1,dl:a[7]}));
  } else {
    E=j.e.map((a,i)=>({i,w:a[0],sy:a[1],ar:a[2],ps:a[3],df:a[4],rel:a[5],cat:a[6],pg:a[7],wm:a[8]||null,st:/^\s*<span class="core"/.test(a[4])?1:0,dl:a[4].length}));
    NMAIN=E.filter(e=>e.ps!=='Info'&&!/abgeleitet von/.test(e.df)).length;
  }
  const NB=E.length;                   // AI entries are added after these and bring their own definitions
  E.forEach(e=>{if(!WIDX.has(e.w))WIDX.set(e.w,e.i)});
  // older spellings and words without homograph number still open the right entry (saved lists, flashcards)
  for(const [o,n] of Object.entries(j.a||{})){if(!WIDX.has(o)&&WIDX.has(n))WIDX.set(o,WIDX.get(n))}
  E.forEach(e=>{const p=e.w.replace(/[¹²³⁴⁵⁶⁷⁸⁹]/g,'');if(!WIDX.has(p))WIDX.set(p,e.i)});
  FOLD=E.map(e=>fold(e.w));
  if(defsP){
    defsP.then(d=>{ for(let i=0;i<NB&&i<d.length;i++){const x=d[i],e=E[i]; e.df=x[0]; e.rel=x[1]||[]; e.wm=x[2]||null} setFull() })
      .catch(()=>{ const v=V(); if(v&&v.querySelector('.loading[data-full]'))v.innerHTML='<div class="empty"><span class="em">⚠️</span>Die Wörterbuch-Daten konnten nicht geladen werden. Bitte prüfe die Internetverbindung und lade die Seite neu.</div>' });
  } else setFull();
  // AI entries arrive on their own; only pages that may need one are drawn again
  aip.then(list=>{ if(!list)return; addAIEntries(list);
    const h=location.hash, w=h.startsWith('#/w/')?decodeURIComponent(h.slice(4)):null;
    if(FULL&&((w&&WIDX.get(w)!=null&&E[WIDX.get(w)].ai)||/^#\/(study|list)\//.test(h)))route() });
  if(!isGram())route();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
/* ---------- search ---------- */
function search(qr,limit=60){
  const f=fold(qr); if(!f)return [];
  const pre=[],sub=[];
  for(let i=0;i<FOLD.length;i++){
    const fw=FOLD[i];
    if(fw.startsWith(f))pre.push(i);
    else if(fw.includes(f))sub.push(i);
    if(pre.length>=limit)break;
  }
  return pre.concat(sub).slice(0,limit).map(i=>E[i]);
}
const POSL={n:'Substantiv',v:'Verb',adj:'Adjektiv',adv:'Adverb',prp:'Präp.',kon:'Konj.',pro:'Pron.',num:'Num.',ptk:'Partikel'};
const gcol=a=>a==='der'?'var(--der)':a==='die'?'var(--die)':a==='das'?'var(--das)':'var(--faint)';
/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(2)||'';
  const [p,arg]=[h.split('/')[0],decodeURIComponent(h.split('/').slice(1).join('/')||'')];
  if(!FULL&&!['','cats','g','lists','decks'].includes(p)){        // definitions are still arriving
    if(!V().querySelector('.loading[data-full]'))V().innerHTML='<div class="loading" data-full="1"><div class="spin"></div>Einträge werden geladen …</div>';
    FULLP.then(()=>{ if(location.hash.slice(2)===h)route() }); return }
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.remove('on'));
  const setOn=t=>{const el=document.querySelector(`#tabs a[data-t="${t}"]`);if(el)el.classList.add('on')};
  if(p===''){setOn('home');viewHome()}
  else if(p==='w'){setOn('home');viewWord(arg)}
  else if(p==='cats'){setOn('cats');viewCats()}
  else if(p==='cat'){setOn('cats');viewCat(arg)}
  else if(p==='lists'){setOn('lists');viewLists()}
  else if(p==='list'){setOn('lists');viewList(arg)}
  else if(p==='decks'){setOn('decks');viewDecks()}
  else if(p==='study'){setOn('decks');viewStudy(arg)}
  else if(p==='play'&&window.PLAY){setOn('play');PLAY.view(arg)}
  else if(p==='g'){setOn('gram');openGram(arg)}
  else viewHome();
  if(p!=='play'&&window.PLAY)PLAY.leave();
  if(p!=='g'&&window.GRAM)GRAM.leave();
  if(p!=='study')window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
/* grammar: its code and chapters load only when the tab is opened, so the dictionary is not slowed down */
let gramP=null;

/* word of the day: a core-vocabulary word, the same for everyone on a given day */
function wordOfDay(){
  const pool=E.filter(e=>e.st&&/^(n|v|adj)$/.test(e.ps)&&!/[¹²³]/.test(e.w));
  if(!pool.length)return null;
  const d=new Date(), k=d.getFullYear()*372+d.getMonth()*31+d.getDate();
  let h=k; h=(h^61)^(h>>>16); h=(h+(h<<3))>>>0; h^=h>>>4; h=Math.imul(h,0x27d4eb2d)>>>0; h^=h>>>15;
  return pool[(h>>>0)%pool.length];
}
function gloss(e){   // first meaning, without headword, pronunciation, article, inflection and labels
  let h=e.df.replace(/^\s*<span class="core"[^>]*>★<\/span>\s*/,'').replace(/^\s*<b>[^<]*<\/b>/,'');
  const k=h.indexOf('<span class="sn">1</span>');
  if(k>=0) h=h.slice(k+25);
  else h=h.replace(/^(\s*(\[[^\]]*\]?|[^\s<]*\]|<i class="g">[^<]*<\/i>|<small>[^<]*<\/small>|\((?:[^()]|\([^()]*\))*\)|[;,]))+/,'');
  let t=h.replace(/<span class="sn">\d+<\/span>/g,' ¶ ').replace(/<span class="kb">K<\/span>/g,' ¶ ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  t=t.split(/ ¶ | \| /)[0].replace(/^[;,:\s]+/,'').trim();
  return t.length>150?t.slice(0,148).replace(/\s\S*$/,'')+' …':t;
}

/* ---------- ENTRY LAYOUT: grammar line, numbered senses with examples, compounds, idioms, derived words ---------- */
function fmtDef(e,compact){
  const card=compact==='card';
  let h=e.df, star=/^\s*<span class="core"/.test(h);
  h=h.replace(/^\s*<span class="core"[^>]*>★<\/span>\s*/,'').replace(/^\s*<b>[^<]*<\/b>\s*/,'');
  if(/abgeleitet von/.test(h)||e.ps==='Info')return (star?'<span class="core">★</span> ':'')+h;
  // idioms: "■ ID ..." at the end
  let idioms='';
  const im=h.search(/<span class="sq"><\/span>\s*(<small>)?\s*ID\b/);
  if(im>=0){idioms=h.slice(im).replace(/^<span class="sq"><\/span>\s*(<small>)?\s*ID\s*(<\/small>)?\s*/,''); h=h.slice(0,im)}
  // grammar line = everything before the first sense number (or before the meaning if there are none)
  let head='', body=h;
  const k=h.search(/<span class="sn">\d+<\/span>/);
  if(k>=0){head=h.slice(0,k); body=h.slice(k)}
  else{const m=h.match(/^(\s*(\[[^\]]*\]?|[^\s<]*\]|<i class="g">[^<]*<\/i>|<small>[^<]*<\/small>|\((?:[^()]|\([^()]*\))*\)|[;,]))+/); if(m){head=m[0]; body=h.slice(m[0].length)}}
  const senses=k>=0?body.split(/(?=<span class="sn">\d+<\/span>)/):[body];
  const part=txt=>{          // split one sense into meaning / examples / compounds / notes / derived words
    const o={def:'',ex:[],comp:[],note:[],der:[]}; let mode='def';
    txt.split(/(<span class="kb">K<\/span>|<span class="ib">i<\/span>|(?:<small>)?\|(?:<\/small>)?|•\s*(?=hierzu|zu\s*[\d(]))/).forEach(t=>{
      if(/^<span class="kb">/.test(t)){mode='comp';o.comp.push('');return}
      if(/^<span class="ib">/.test(t)){mode='note';o.note.push('');return}
      if(/^(<small>)?\|/.test(t)){mode='ex';o.ex.push('');return}
      if(/^•/.test(t)){mode='der';o.der.push('');return}
      if(mode==='def')o.def+=t; else o[mode][o[mode].length-1]+=t;
    });
    for(const key of ['ex','comp','note','der'])o[key]=o[key].map(x=>x.trim()).filter(x=>x.replace(/<[^>]+>/g,'').trim());
    return o;
  };
  const sub=o=>`${o.ex.length?`<ul class="dx">${o.ex.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${o.comp.length?`<div class="dk"><span class="kb">K</span><span>${o.comp.join(' ')}</span></div>`:''}
    ${o.note.length?`<div class="dn"><span class="ib">i</span><span>${o.note.join(' ')}</span></div>`:''}`;
  let html='', allDer=[];
  if(star||head.replace(/<[^>]+>/g,'').trim())html+=`<div class="dgram">${star?'<span class="core" title="Grundwortschatz">★</span>':''}${head}</div>`;
  const total=senses.filter(x=>/^<span class="sn">/.test(x)).length;
  const items=(card?senses.slice(0,3):senses).map(sx=>{
    const m=sx.match(/^<span class="sn">(\d+)<\/span>/); const num=m?m[1]:'';
    const o=part(m?sx.slice(m[0].length):sx); allDer=allDer.concat(o.der);
    if(!o.def.replace(/<[^>]+>/g,'').trim()&&!o.ex.length&&!o.comp.length&&!o.note.length)return '';
    const exs=card&&o.ex.length?`<ul class="dx"><li>${o.ex[0]}</li></ul>`:'';
    return `<li class="ds">${num?`<span class="sn">${num}</span>`:''}<div class="db"><div class="dd">${o.def.trim()}</div>${card?exs:compact?'':sub(o)}</div></li>`;
  }).join('');
  html+=`<ol class="dl${k>=0?'':' one'}">${items}</ol>`;
  if(card)return html+(total>3?`<a class="fmore" href="#/w/${encodeURIComponent(e.w)}">+ ${total-3} weitere Bedeutungen im Eintrag</a>`:'');
  if(!compact&&idioms.replace(/<[^>]+>/g,'').trim()){
    const ip=part(idioms);
    const list=ip.def.split(/;\s*(?=<b>)/).map(x=>x.trim()).filter(Boolean);
    html+=`<div class="dsec"><h5>Redewendungen</h5><ul class="did">${list.map(x=>`<li>${x}</li>`).join('')}</ul>${sub(ip)}</div>`;
    allDer=allDer.concat(ip.der);
  }
  if(!compact&&allDer.length)html+=`<div class="dsec dder"><h5>Abgeleitete Wörter</h5><p>${allDer.join(' · ').replace(/^(hierzu|zu)\s*/,'')}</p></div>`;
  return html;
}

/* Commons recordings: link straight to upload.wikimedia.org (md5 path) instead of Special:FilePath,
   which costs two redirects. Safari has no Ogg, so it gets Commons' MP3 copy. Preloaded when an entry opens. */
function md5(str){
  const b=new TextEncoder().encode(str),n=((b.length+8>>6)+1)*16,x=new Array(n).fill(0);
  for(let i=0;i<b.length;i++)x[i>>2]|=b[i]<<(i%4*8);
  x[b.length>>2]|=0x80<<(b.length%4*8); x[n-2]=b.length*8;
  const K=[],S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*2**32)|0;
  let h0=0x67452301,h1=0xefcdab89|0,h2=0x98badcfe|0,h3=0x10325476;
  for(let o=0;o<n;o+=16){
    let A=h0,B=h1,C=h2,D=h3;
    for(let i=0;i<64;i++){
      let f,g,r=i>>4;
      if(r===0){f=(B&C)|(~B&D);g=i}else if(r===1){f=(D&B)|(~D&C);g=(5*i+1)%16}
      else if(r===2){f=B^C^D;g=(3*i+5)%16}else{f=C^(B|~D);g=7*i%16}
      const t=D;D=C;C=B;const sum=(A+f+K[i]+x[o+g])|0,sh=S[r*4+i%4];
      B=(B+((sum<<sh)|(sum>>>(32-sh))))|0;A=t;
    }
    h0=(h0+A)|0;h1=(h1+B)|0;h2=(h2+C)|0;h3=(h3+D)|0;
  }
  return [h0,h1,h2,h3].map(v=>[0,8,16,24].map(s=>((v>>>s)&255).toString(16).padStart(2,'0')).join('')).join('');
}
const CAN_OGG=!!document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"');
const SNDC=new Map();   // word -> {a:Audio, ok:true|false|null}
function sndURL(w){
  const f=('De-'+w+'.ogg').replace(/ /g,'_'),h=md5(f),p=h[0]+'/'+h.slice(0,2)+'/',e=encodeURIComponent(f);
  return 'https://upload.wikimedia.org/wikipedia/commons/'+(CAN_OGG?p+e:'transcoded/'+p+e+'/'+e+'.mp3');
}
function sndGet(w){
  let c=SNDC.get(w); if(c)return c;
  const a=new Audio(); c={a,ok:null}; a.preload='auto';
  a.addEventListener('canplaythrough',()=>{c.ok=true},{once:true});
  a.addEventListener('error',()=>{c.ok=false});
  a.src=sndURL(w); SNDC.set(w,c);
  if(SNDC.size>60)SNDC.delete(SNDC.keys().next().value);
  return c;
}
function preSay(i){const w=E[i]&&plainW(E[i].w); if(w&&!/\s/.test(w))sndGet(w)}
let sayTok=0;
function say(i,btn){
  const w=plainW(E[i].w); sayTok++;
  if(curAudio){curAudio.pause();curAudio=null}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(/\s/.test(w)){speak(w);return}
  const c=sndGet(w); if(c.ok===false){speak(w);return}
  const a=c.a, my=++sayTok; curAudio=a; let done=false;
  const fall=err=>{if(done)return;done=true;if(err===true)c.ok=false;if(my!==sayTok)return;a.pause();curAudio=null;speak(w)};
  a.addEventListener('error',()=>fall(true),{once:true});
  const t=setTimeout(()=>{if(!done&&a.readyState<3)fall()},2500);
  try{a.currentTime=0}catch(_){}
  a.play().then(()=>{if(done||my!==sayTok){if(my!==sayTok||done)a.pause();return}done=true;clearTimeout(t);if(btn)btn.title='Aufnahme: Wikimedia Commons'}).catch(()=>fall());
}

async function jget(url,ms=7000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal}); return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(t)}

async function enWord(w){            // first English translation from German Wiktionary
  const j=await jget('https://de.wiktionary.org/w/api.php?action=parse&prop=wikitext&format=json&origin=*&page='+encodeURIComponent(w));
  const t=j&&j.parse&&j.parse.wikitext&&j.parse.wikitext['*']; if(!t)return null;
  // the translation listed most often (müde: sleepy, tired, tired -> tired); on a tie the first one
  // templates right next to each other are one phrase: {{Ü|en|female}} {{Ü|en|member of parliament}}
  const all=[];
  for(const line of t.split('\n').filter(l=>/^\*\s*\{\{en\}\}/.test(l)))
    for(const grp of line.match(/(?:\{\{Ü\|en\|[^}]*\}\}[ \t]*)+/g)||[]){
      const ph=[...grp.matchAll(/\{\{Ü\|en\|([^}|]+)/g)].map(m=>m[1].replace(/\[\[|\]\]/g,'').trim()).join(' ')
        .replace(/\b(female|male|feminine|masculine|woman's|man's)\b/gi,'').replace(/\s+/g,' ').trim();
      if(ph&&!/^(person|someone|somebody|something|thing|one|people)$/i.test(ph))all.push(ph);
    }
  if(!all.length)return null;
  const n={}; all.forEach(x=>n[x]=(n[x]||0)+1); return all.reduce((a,b)=>n[b]>n[a]?b:a);
}
function gerund(v){ v=v.replace(/^to /,'').trim(); const [h,...rest]=v.split(' '); let g;   // "peel off" -> "peeling off"
  if(/[^aeiou]e$/.test(h)&&!/ee$/.test(h))g=h.slice(0,-1)+'ing';
  else if(/^[^aeiou]*[aeiou][bdgmnprt]$/.test(h))g=h+h.slice(-1)+'ing'; else g=h+'ing';
  return [g,...rest].join(' ')}

/* picture sources */
const PEOPLE='(?:person|people|man|men|woman|women|girl|boy|child|children|kid|face|portrait)';
// Wikimedia Commons; keeps only files whose name mentions the search words
// (strict: every word must appear, "person" also matches man/woman/child/face …)
async function commons(q,strict){
  const SER={};
  const j=await jget('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=20'
    +'&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=480&gsrsearch='+encodeURIComponent(q+' filetype:bitmap'));
  const pages=j&&j.query?Object.values(j.query.pages).sort((a,b)=>a.index-b.index):[];
  const keys=q.toLowerCase().split(/\s+/).filter(k=>k.length>=3&&!['the','and'].includes(k))
    .map(k=>new RegExp('(?:^|[^a-z])'+(k==='person'||k==='face'?PEOPLE:k.slice(0,5).replace(/[^a-z]/g,'')),'i'));
  return pages.filter(p=>{const t=p.title.replace(/^File:/,'').replace(/_/g,' ');
      return !keys.length||(strict?keys.every(k=>k.test(t)):keys.some(k=>k.test(t)))})
    .map(p=>p.imageinfo&&p.imageinfo[0]).filter(i=>i&&/jpeg|png|webp/.test(i.mime)&&goodShape(i.width,i.height))
    .filter(i=>{const b=decodeURIComponent(i.descriptionurl.split('File:')[1]||'').replace(/[\s_()-]*\d+[\s_)]*(?=\.\w+$)/,'').replace(/\.\w+$/,'').toLowerCase();
      SER[b]=(SER[b]||0)+1; return SER[b]<=2})
    .map(i=>({src:i.thumburl||i.url,url:i.descriptionurl,cap:'Wikimedia Commons'}));
}
async function wikiDe(q){             // best-matching German Wikipedia articles with a picture (finds "Kulturapfel" for "Apfel")
  const j=await jget('https://de.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages|pageprops'
    +'&piprop=thumbnail&pithumbsize=480&gsrsearch='+encodeURIComponent(q));
  const ps=j&&j.query?Object.values(j.query.pages).sort((a,b)=>a.index-b.index):[];
  return ps.filter(p=>p.thumbnail&&!(p.pageprops&&'disambiguation' in p.pageprops)&&goodShape(p.thumbnail.width,p.thumbnail.height))
    .slice(0,2).map(p=>({src:p.thumbnail.source,url:'https://de.wikipedia.org/wiki/'+encodeURIComponent(p.title),cap:'Wikipedia · '+p.title}));
}

/* what kind of word is it? decides which source is tried first */
const ABSCAT=new Set(['abstrakt','gefuehle','denken','charakter','beziehung']), PERSONCAT=new Set(['gefuehle','charakter','koerper','gesundheit','beziehung']);
const THINGCAT=new Set(['essen','tiere','pflanzen','wohnen','haushalt','kleidung','werkzeug','verkehr','material','technik','computer','kommunikation','natur','sport','musik','landwirt']);
const COLOURS=/^(red|blue|green|yellow|black|white|brown|orange|purple|violet|pink|grey|gray|golden|silver|turquoise|beige)$/;
function imgKind(e){
  const w=plainW(e.w);
  if(e.ps==='v')return 'verb';
  if(e.ps==='adj'||e.ps==='Partizip')return e.cat==='farben'||COLOURS.test(ENC.get(w)&&ENC.get(w).v||'')?'colour':'adj';
  if(e.ps==='n'&&(ABSCAT.has(e.cat)||/(heit|keit|ismus|schaft|tum|nis|tät|anz|enz)$/.test(w)))return 'abstract';
  return 'thing';
}
// the thing a verb or adjective is used with, from the dictionary's examples ("einen Apfel schälen" -> Apfel)
function exampleNoun(e){
  const self=plainW(e.w).toLowerCase();
  for(const ex of examples(e,2)){
    for(const t of ex.match(/[A-ZÄÖÜ][a-zäöüß]{3,}/g)||[]){
      for(const c of [t,t.replace(/(en|n|e|s)$/,''),t.replace(/e?n$/,'')]){
        const i=WIDX.get(c); if(i!=null&&E[i].ps==='n'&&plainW(E[i].w).toLowerCase()!==self&&THINGCAT.has(E[i].cat))return plainW(E[i].w);
      }
    }
  }
  return null;
}
async function findImgs(e){
  const w=plainW(e.w), out=[], seen=new Set(), add=a=>a.forEach(x=>{if(x.src&&!seen.has(x.src)){seen.add(x.src);out.push(x)}});
  const en=await enCached(w), kind=imgKind(e);
  const noun=(kind==='verb'||kind==='adj')?exampleNoun(e):null, obj=noun?await enCached(noun):null;
  let plan;                           // [source, query] in order of how good that source usually is for this kind of word
  if(kind==='thing')         plan=[[wikiDe,w],[wikiEn,en],[commons,en],[commons,w],[stock,en]];
  else if(kind==='abstract') plan=[[wikiEn,en],[stock,en],[wikiDe,w],[commons,en]];
  else if(kind==='colour')   plan=[[wikiEn,en&&en+' (color)'],[wikiEn,en],[commons,en&&en+' colour']];
  else if(kind==='verb'){ const g=en&&gerund(en);
    plan=[[stock,g&&(obj?g+' '+obj:'person '+g)],[commons,g&&obj&&g+' '+obj,1],[wikiEn,g],[commons,g&&'person '+g,1],[commons,g&&obj&&g+' '+obj],[commons,g]];
  } else {                            // adjectives: the quality on a typical person or thing
    const who=PERSONCAT.has(e.cat)||!obj?'person':obj;
    plan=[[stock,en&&en+' '+who],[commons,en&&en+' '+who,1],[commons,en&&obj&&en+' '+obj,1],[commons,en&&en+' face',1],[wikiEn,en]];
  }
  for(const [src,q,strict] of plan){ if(!q)continue; add(await src(q,strict)); if(out.length>=6)break }
  if(!out.length)add(await commons(w));  // last resort: the German word itself
  return out;
}

/* ---------- WORD MAP: synonyms, opposites, word family and words close in meaning ---------- */
const WMG=[{k:'s',label:'Synonyme (≈)',col:'var(--das)',max:5},{k:'g',label:'Gegenteil (↔)',col:'var(--die)',max:3},
  {k:'f',label:'Wortfamilie',col:'var(--der)',max:5},{k:'n',label:'Ähnliche Bedeutung',col:'var(--neu)',max:7}];
function wmNode(w){return WIDX.has(w)?w:(WIDX.has(w+'¹')?w+'¹':null)}
function wordMap(e){
  const m=e.wm||{}; const fam=(m.f||e.rel||[]);
  const W=Math.max(330,Math.min(680,((V()&&V().clientWidth)||680)-50)), small=W<480;
  const groups=WMG.map(g=>({...g,items:(g.k==='f'?fam:(m[g.k]||[])).slice(0,small?Math.ceil(g.max*.6):g.max).map(x=>Array.isArray(x)?{w:x[0],s:x[1]}:{w:x,s:null})})).filter(g=>g.items.length);
  const total=groups.reduce((n,g)=>n+g.items.length,0);
  if(!total)return '';
  const H=Math.round(small?W*1.05:Math.min(460,W*.68)),cx=W/2,cy=H/2,Rx=cx-(small?50:70),Ry=cy-24;
  let ang=-Math.PI/2, lines='', nodes='';
  const gap=total>1?0.18:0, span=2*Math.PI-gap*groups.length;
  groups.forEach(g=>{
    const share=span*g.items.length/total;
    g.items.forEach((it,k)=>{
      const a=ang+share*(k+.5)/g.items.length;
      // closer to the centre = closer in meaning (scores 0.45..1)
      let rr = g.k==='n' ? 1.0-Math.min(1,Math.max(0,(it.s-.45)/.5))*.32 : g.k==='f' ? .95 : .62;
      rr*= (k%2? 1.0:.9);
      const x=cx+rr*Rx*Math.cos(a), y=cy+rr*Ry*Math.sin(a);
      const lim=small?12:16, t=wmNode(it.w), short=it.w.length>lim?it.w.slice(0,lim-1)+'…':it.w, wpx=short.length*7.6+22;
      lines+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${g.col}" stroke-opacity=".35" stroke-width="${g.k==='n'?1+2.5*Math.max(0,(it.s-.45)/.5):1.6}"/>`;
      nodes+=`<g class="node" tabindex="0" role="button" data-w="${esc(t||'')}" data-l="${esc(it.w)}" data-g="${g.k}" data-s="${it.s!=null?it.s:''}" aria-label="${esc(it.w)}">
        <rect x="${x-wpx/2}" y="${y-13}" width="${wpx}" height="26" rx="13" fill="var(--card)" stroke="${g.col}" stroke-width="${t?1.6:1}" ${t?'':'stroke-dasharray="3 3"'}/>
        <text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="13" fill="${t?g.col:'var(--mut)'}">${esc(short)}</text></g>`;
    });

/* ---------- SM-2 (Anki-style) ---------- */
function newCard(){return {state:'new',ef:2.5,iv:0,reps:0,lapses:0,step:0,due:now()}}
const LEARN=[1,10]; // minutes
function grade(c,g){ // g: 0 again,1 hard,2 good,3 easy
  if(c.state==='new'||c.state==='learning'){
    if(g===0){c.state='learning';c.step=0;c.due=now()+LEARN[0]*60000}
    else if(g===1){c.state='learning';c.due=now()+Math.round(((LEARN[c.step]||5)*0.6+2))*60000}
    else if(g===2){
      if(c.step>=LEARN.length-1){c.state='review';c.reps=1;c.iv=1;c.due=now()+DAY} // graduate
      else{c.step++;c.state='learning';c.due=now()+LEARN[c.step]*60000}
    } else {c.state='review';c.reps=1;c.iv=4;c.ef=Math.min(2.6,c.ef+0.0);c.due=now()+4*DAY} // easy graduate
    return;
  }
  // review
  if(g===0){c.lapses++;c.reps=0;c.state='learning';c.step=0;c.ef=Math.max(1.3,c.ef-0.2);c.iv=0;c.due=now()+LEARN[0]*60000;return}
  let q=g===1?3:g===2?4:5;
  c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  if(g===1)c.iv=Math.max(1,Math.round(c.iv*1.2));
  else if(g===2)c.iv=Math.max(1,Math.round(c.iv*c.ef));
  else c.iv=Math.max(1,Math.round(c.iv*c.ef*1.3));
  c.reps++; c.due=now()+c.iv*DAY;
}
function nextIvLabel(c,g){ // human preview
  const t=JSON.parse(JSON.stringify(c)); grade(t,g);
  const d=t.due-now();
  if(d<60000)return '<1 Min';
  if(d<3600000)return Math.round(d/60000)+' Min';
  if(d<DAY)return Math.round(d/3600000)+' Std';
  return Math.round(d/DAY)+' T';
}
function dueQueue(deck,newLimit=20){
  const t=now(); const nw=[],lr=[],rv=[];
  for(const w in deck.cards){const c=deck.cards[w];
    if(c.state==='new')nw.push(w);
    else if(c.due<=t){(c.state==='learning'?lr:rv).push(w)}}
  return {nw:nw.slice(0,newLimit),lr,rv,all:lr.concat(rv,nw.slice(0,newLimit))};
}

<script>
"use strict";
(function(){
const SB_URL='https://vnnhyhicppkexdibuqyu.supabase.co';
const SB_KEY='sb_publishable_sNNNyEu6D9_Sjy0O0MaS5Q_VyReD7Tj'; // publishable key: safe to be public, data is protected by row level security
const SITE=location.origin+location.pathname;
const SKEY='gd_session';
let session=LS.get(SKEY,null);
let timer=null, pushing=false, dirty=false, failed=false;
const cacheKey=()=>'gd_cache_'+session.user.id;
const $=id=>document.getElementById(id);
const isEmpty=o=>!o||!Object.keys(o).length;

/* ---------- Supabase REST ---------- */
async function api(path,{method='GET',body,token,headers={}}={}){
  const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},headers);
  if(token)h.Authorization='Bearer '+token;
  const r=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));e.status=r.status;e.code=j&&(j.error_code||j.code);throw e}
  return j;
}
function keep(s,user){
  const u=user||s.user;
  session={access_token:s.access_token,refresh_token:s.refresh_token,
    expires_at:+s.expires_at||Math.floor(Date.now()/1000)+(+s.expires_in||3600),
    user:{id:u.id,email:u.email}};
  LS.set(SKEY,session);
}
async function token(){
  if(!session)throw new Error('Nicht angemeldet');
  if(session.expires_at-60>Date.now()/1000)return session.access_token;
  try{const s=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});keep(s);return session.access_token}
  catch(e){if(e.status>=400&&e.status<500)endSession('Sitzung abgelaufen – bitte neu anmelden');throw e}
}
function de(e){
  const m=String(e&&e.message||e), c=String(e&&e.code||''), s=m+' '+c;
  if(/invalid login|invalid_credentials/i.test(s))return 'E-Mail oder Passwort ist falsch.';
  if(/not confirmed|email_not_confirmed/i.test(s))return 'Bitte bestätige zuerst deine E-Mail-Adresse (Link im Postfach).';
  if(/already registered|user_already_exists/i.test(s))return 'Für diese E-Mail gibt es schon ein Konto. Bitte melde dich an.';
  if(/password should|weak_password/i.test(s))return 'Das Passwort muss mindestens 6 Zeichen haben.';
  if(/same_password|should be different/i.test(s))return 'Das neue Passwort muss sich vom alten unterscheiden.';
  if(/rate limit|over_.*rate_limit/i.test(s)||e.status===429)return 'Zu viele Versuche. Bitte warte etwas und versuche es dann erneut.';
  if(/invalid.*email|email_address_invalid/i.test(s))return 'Diese E-Mail-Adresse ist ungültig.';
  if(/PGRST205|PGRST202|42P01/.test(c))return 'Die Datenbank ist noch nicht eingerichtet.';
  if(/failed to fetch|networkerror|load failed/i.test(m))return 'Keine Verbindung zum Server.';
  return m;
}

/* ---------- account data ---------- */
let NOPREFS=false;
function writeCache(){if(session)LS.set(cacheKey(),{lists,decks,prefs,dirty})}
function rerender(){if(E.length&&!location.hash.startsWith('#/study'))route()}
async function pull(){
  let rows;
  try{ if(NOPREFS)throw 0; rows=await api('/rest/v1/user_data?select=lists,decks,prefs&user_id=eq.'+session.user.id,{token:await token()}) }
  catch(err){ if(err&&err.status!==400&&err!==0)throw err; NOPREFS=true; rows=await api('/rest/v1/user_data?select=lists,decks&user_id=eq.'+session.user.id,{token:await token()}) }
  return rows&&rows[0]||null;
}
async function push(){
  if(!session)return;
  if(pushing){dirty=true;return}
  clearTimeout(timer);timer=null;
  pushing=true;dirty=false;
  const who=session.user.id;
  try{
    await api('/rest/v1/user_data?on_conflict=user_id',{method:'POST',token:await token(),
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:Object.assign({user_id:who,lists,decks,updated_at:new Date().toISOString()},NOPREFS?{}:{prefs})}).catch(async err=>{ if(err&&err.status===400&&!NOPREFS){NOPREFS=true; return api('/rest/v1/user_data?on_conflict=user_id',{method:'POST',token:await token(),headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{user_id:who,lists,decks,updated_at:new Date().toISOString()}})} throw err });
    failed=false;
  }catch(e){
    dirty=true;
    if(!failed)toast('Nicht gespeichert: '+de(e));
    failed=true;
  }finally{
    pushing=false;
    if(session&&session.user.id===who){
      writeCache();
      if(dirty&&!timer)timer=setTimeout(push,failed?15000:300);
    }
  }
}
function schedule(){dirty=true;writeCache();clearTimeout(timer);timer=setTimeout(push,600)}

/* keep the original guest behaviour, save to the account when signed in */
const guestLists=saveLists, guestDecks=saveDecks, guestPrefs=savePrefs;
savePrefs=function(){session?schedule():guestPrefs()};
saveLists=function(){session?schedule():guestLists()};
saveDecks=function(){session?schedule():guestDecks()};

async function afterLogin(fresh){
  setBtn();
  const c=LS.get(cacheKey(),null);
  if(c){lists=c.lists||{};decks=c.decks||{};prefs=c.prefs||{};dirty=!!c.dirty}else{lists={};decks={};prefs={};dirty=false}
  rerender();
  let row;
  try{
    if(dirty&&c){await push();return}
    row=await pull();
  }catch(e){toast(de(e));return}
  let L=row?row.lists||{}:{}, D=row?row.decks||{}:{}, save=!row;
  const gp=LS.get('gd_prefs',{});
  let P=Object.assign({},row&&row.prefs||{}); P.img=Object.assign({},gp.img||{},P.img||{}); if(!row||!row.prefs&&gp.img)save=true;
  const gl=LS.get('gd_lists',{}), gd=LS.get('gd_decks',{});
  if(fresh&&(!isEmpty(gl)||!isEmpty(gd))&&confirm('Auf diesem Gerät gibt es Listen oder Karten ohne Konto. Sollen sie in dein Konto übernommen werden?')){
    L=Object.assign({},L,gl);D=Object.assign({},D,gd);
    LS.set('gd_lists',{});LS.set('gd_decks',{});save=true;
  }
  lists=L;decks=D;prefs=P;dirty=false;writeCache();rerender();
  if(save)await push();
}
function endSession(msg){
  if(session)try{localStorage.removeItem(cacheKey())}catch(e){}
  session=null;clearTimeout(timer);timer=null;dirty=false;failed=false;
  try{localStorage.removeItem(SKEY)}catch(e){}
  lists=LS.get('gd_lists',{});decks=LS.get('gd_decks',{});prefs=LS.get('gd_prefs',{});
  setBtn();closeSheet();rerender();
  if(msg)toast(msg);
}
async function signOut(){
  if(dirty||timer){await push();if(dirty&&!confirm('Einige Änderungen konnten noch nicht gespeichert werden. Trotzdem abmelden?'))return}
  const t=session.access_token;
  api('/auth/v1/logout',{method:'POST',token:t}).catch(()=>{});
  endSession('Abgemeldet');
}

/* ---------- UI ---------- */
function setBtn(){
  const b=$('acct');if(!b)return;
  if(session){b.textContent=(session.user.email||'?')[0].toUpperCase();b.classList.add('in');b.title='Konto: '+session.user.email}
  else{b.innerHTML='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Anmelden</span>';
    b.classList.remove('in');b.title='Anmelden oder kostenloses Konto erstellen'}
  b.classList.toggle('signin',!session)
}
let lastEmail='';
// welcome e-mail for brand-new accounts (sent by our Cloudflare worker; it checks the account is new)
function welcomeMail(tok){fetch('https://woerterbuch-bilder.edwin1kitaka.workers.dev/welcome',{method:'POST',headers:{Authorization:'Bearer '+tok}}).catch(()=>{})}
function msg(t,ok){const m=$('ac_msg');if(m){m.textContent=t||'';m.classList.toggle('ok',!!ok)}}
function sheet(mode){
  const em=$('ac_em');if(em&&em.value)lastEmail=em.value;
  if(mode==='me'){
    const n=Object.keys(lists).length, k=Object.keys(decks).length;
    openSheet(`<h3>Dein Konto</h3>
      <div class="acct-who"><div class="av">${esc((session.user.email||'?')[0].toUpperCase())}</div>
      <div><div class="em">${esc(session.user.email||'')}</div><div class="muted" style="font-size:.82rem">${n} ${n===1?'Liste':'Listen'} · ${k} ${k===1?'Stapel':'Stapel'} · ${dirty?'wird gespeichert …':'gespeichert ✓'}</div></div></div>
      <p>Deine Listen und Karten gehören nur zu diesem Konto und werden auf jedem Gerät geladen, auf dem du dich anmeldest.</p>
      <div class="row"><button class="acct-link" onclick="ACCT.sheet('newpw')">Passwort ändern</button><span class="spacer"></span>
      <button class="btn" onclick="closeSheet()">Schließen</button><button class="btn primary" onclick="ACCT.signOut()">Abmelden</button></div>`);
    return;
  }
  const T={in:['Anmelden','Anmelden'],up:['Konto erstellen','Registrieren'],reset:['Passwort vergessen','Link senden'],newpw:['Neues Passwort','Speichern']}[mode];
  const tabs=(mode==='in'||mode==='up')?`<div class="acct-tabs"><button type="button" class="${mode==='in'?'on':''}" onclick="ACCT.sheet('in')">Anmelden</button><button type="button" class="${mode==='up'?'on':''}" onclick="ACCT.sheet('up')">Registrieren</button></div>`:'';
  const intro={in:'Melde dich an, um deine Listen und Karten auf jedem Gerät zu haben.',
    up:'Mit einem Konto werden deine Listen und Karten gespeichert. Niemand sonst kann sie sehen.',
    reset:'Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort festlegst.',
    newpw:'Lege ein neues Passwort für dein Konto fest.'}[mode];
  const emailIn=mode==='newpw'?'':`<input class="input" id="ac_em" type="email" autocomplete="email" placeholder="E-Mail" required value="${esc(lastEmail).replace(/"/g,'&quot;')}">`;
  const pwIn=mode==='reset'?'':`<input class="input" id="ac_pw" type="password" minlength="6" required autocomplete="${mode==='in'?'current-password':'new-password'}" placeholder="${mode==='in'?'Passwort':'Passwort (mind. 6 Zeichen)'}">`;
  openSheet(`<h3>${T[0]}</h3><p>${intro}</p>${tabs}
    <form class="acct-f" onsubmit="event.preventDefault();ACCT.submit('${mode}')">${emailIn}${pwIn}
    <div class="acct-msg" id="ac_msg"></div>
    <div class="row">${mode==='in'?`<button type="button" class="acct-link" onclick="ACCT.sheet('reset')">Passwort vergessen?</button>`:''}${mode==='reset'?`<button type="button" class="acct-link" onclick="ACCT.sheet('in')">Zurück zur Anmeldung</button>`:''}
    <span class="spacer"></span><button type="button" class="btn" onclick="closeSheet()">Abbrechen</button><button class="btn primary" id="ac_go" type="submit">${T[1]}</button></div></form>`);
  setTimeout(()=>{const f=$(mode==='newpw'||lastEmail?'ac_pw':'ac_em')||$('ac_em');if(f)f.focus()},60);
}
async function submit(mode){
  const em=($('ac_em')||{}).value, pw=($('ac_pw')||{}).value, go=$('ac_go');
  if(em)lastEmail=em.trim();
  if(go)go.disabled=true; msg('');
  try{
    if(mode==='in'){
      const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:em.trim(),password:pw}});
      keep(s);closeSheet();toast('Angemeldet als '+s.user.email);await afterLogin(true);
    }else if(mode==='up'){
      const r=await api('/auth/v1/signup?redirect_to='+encodeURIComponent(SITE),{method:'POST',body:{email:em.trim(),password:pw}});
      if(r&&r.access_token){keep(r);closeSheet();toast('Konto erstellt');welcomeMail(r.access_token);await afterLogin(true)}
      else if(r&&Array.isArray(r.identities)&&r.identities.length===0)msg('Für diese E-Mail gibt es schon ein Konto. Bitte melde dich an.');
      else msg('Fast geschafft! Wir haben eine E-Mail an '+em.trim()+' geschickt. Klicke auf den Link darin, um dein Konto zu bestätigen.',true);
    }else if(mode==='reset'){
      await api('/auth/v1/recover?redirect_to='+encodeURIComponent(SITE),{method:'POST',body:{email:em.trim()}});
      msg('Falls es ein Konto mit dieser Adresse gibt, ist ein Link unterwegs. Schau in dein Postfach.',true);
    }else if(mode==='newpw'){
      await api('/auth/v1/user',{method:'PUT',token:await token(),body:{password:pw}});
      closeSheet();toast('Passwort geändert');
    }
  }catch(e){msg(de(e))}
  finally{if(go)go.disabled=false}
}

/* header button (placed next to the day/night toggle) */
const th=$('theme');
if(th&&!$('acct')){const b=document.createElement('button');b.className='iconbtn';b.id='acct';th.after(b)}
$('acct').onclick=()=>session?sheet('me'):sheet('in');
window.ACCT={user:()=>session&&session.user,token,api,open:()=>sheet('in')};   // used by the grammar section to save results
setBtn();

/* links from confirmation / password-reset e-mails arrive as #access_token=… */
const hp=new URLSearchParams(location.hash.replace(/^#\/?/,''));
if(hp.get('access_token')||hp.get('error')||hp.get('error_code')){
  history.replaceState(null,'',location.pathname+location.search+'#/');
  if(hp.get('access_token')){
    const type=hp.get('type');
    api('/auth/v1/user',{token:hp.get('access_token')}).then(u=>{
      keep({access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token'),expires_at:hp.get('expires_at'),expires_in:hp.get('expires_in')},u);
      toast(type==='recovery'?'Bitte neues Passwort festlegen':'E-Mail bestätigt – du bist angemeldet');
      return afterLogin(true).then(()=>{if(type==='recovery')sheet('newpw')});
    }).catch(e=>toast(de(e)));
  }else{
    const d=hp.get('error_code')==='otp_expired'?'Der Link ist abgelaufen oder wurde schon benutzt. Bitte fordere einen neuen an.':(hp.get('error_description')||'Anmeldung fehlgeschlagen').replace(/\+/g,' ');
    setTimeout(()=>{sheet('in');msg(d)},300);
  }
}else if(session){
  afterLogin(false);
}

/* save before leaving, refresh when coming back (other device may have changed things) */
document.addEventListener('visibilitychange',async()=>{
  if(!session)return;
  if(document.visibilityState==='hidden'){if(dirty||timer)push();return}
  if(dirty||pushing||timer)return;
  try{const row=await pull();if(!row||!session||dirty||timer)return;
    if(JSON.stringify([row.lists,row.decks,row.prefs||prefs])!==JSON.stringify([lists,decks,prefs])){lists=row.lists||{};decks=row.decks||{};if(row.prefs)prefs=row.prefs;writeCache();rerender()}
  }catch(e){}
});
window.addEventListener('beforeunload',e=>{if(session&&(dirty||timer)){push();e.preventDefault();e.returnValue=''}});

window.ACCT={sheet,submit,signOut};
})();
</script>

})();

// lead picture of the German Wikipedia article with exactly this title (follows redirects, skips ambiguous words)
async function wikiExact(w){

  const p=j&&j.query&&Object.values(j.query.pages)[0];
  if(!p||!p.thumbnail||(p.pageprops&&'disambiguation' in p.pageprops))return [];
  const t=p.thumbnail; if(t.width<200||t.height<150||t.width/t.height>2.2||t.width/t.height<.5)return [];
  if(/(portrait|porträt|_\(\d{4}\)|cropped|signature|logo|wappen|flagge|map|karte)/i.test(t.source))return [];
  return [{src:t.source,title:p.title}];
}

const norm1=s=>fold(String(s).trim().replace(/^(der|die|das)\s+/i,''));
const norm2=s=>String(s).trim().replace(/^(der|die|das)\s+/i,'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');
const sameAns=(a,b)=>norm1(a)===norm1(b)||norm2(a)===norm2(b);
function judge(q,v,tsec){
  if(q.t==='poll')return {ok:null,pts:0};
  if(v==null||v==='')return {ok:false,pts:0};
  let ok=false, frac=1;
  if(q.t==='type')ok=(q.ans||[]).some(a=>sameAns(v,a));
  else if(q.t==='order')ok=Array.isArray(v)&&v.length===q.o.length&&v.map(i=>q.o[i]).join('\u0001')===q.sol.join('\u0001');
  else if(q.t==='slider'){const r=(q.max-q.min)||1, d=Math.abs(+v-q.c); ok=d<=r*.1; frac=d<=r*.01?1:Math.max(.3,1-d/(r*.1))}
  else ok=+v===q.c;
  if(!ok)return {ok:false,pts:0};
  const speed=1-.5*Math.min(1,Math.max(0,tsec)/(q.dur||20));
  return {ok:true,pts:Math.round(1000*speed*frac)*(q.dbl?2:1)};
}
const streakBonus=s=>s>=2?Math.min(s-1,5)*100:0;
function rightText(q){
  if(q.t==='type')return (q.ans||[])[0]||'';
  if(q.t==='order')return (q.sol||[]).join(q.sol&&q.sol.some(x=>x.includes(' '))?' → ':' ');
  if(q.t==='slider')return `${q.c}${q.unit?' '+q.unit:''}`;
  if(q.t==='poll')return '';
  return q.o?q.o[q.c]:'';
}

function gin(html){const b=$('gmin'); if(b){b.innerHTML=html; drawIcons()} return b}
const center=(inner)=>`<div class="gcenter">${inner}</div>`;
const spinner=t=>center(`<div class="gspin"></div><p>${H(t)}</p>`);
function setScore(html){const s=$('gmscore'); if(s)s.innerHTML=html}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas'); cv.className='gconf'; document.body.appendChild(cv);
  const dpr=devicePixelRatio||1, W=cv.width=innerWidth*dpr, Hh=cv.height=innerHeight*dpr, x=cv.getContext('2d');
  const cols=['#7b61ff','#ff6b57','#12b5a5','#f5a524','#ffffff','#3ddc97'];
  const ps=Array.from({length:170},()=>({x:Math.random()*W,y:-Math.random()*Hh*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:(Math.random()*5+4)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[rnd(cols.length)]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,Hh); ps.forEach(p=>{p.x+=p.vx*dpr;p.y+=p.vy*dpr;p.vy+=.04;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(t-t0<4000&&document.body.contains(cv))requestAnimationFrame(f); else cv.remove()})(t0);
}
function tile(i,text,q,extra=''){
  let cls='o'+(i%4+1);
  if(q.t==='art')cls=text; if(q.t==='tf')cls=i===0?'tfw':'tff';
  return `<button class="gt ${cls}" data-i="${i}" ${extra}><span class="gti">${ic(OIC[i%4])}</span><span class="gtt">${H(text)}</span></button>`;
}
function qHead(q,n,total){
  const [lab,icn]=TYPES[q.t]||['Frage','help-circle'];

}
function qCard(q){

const isChoice=q=>['mc','gap','tf','art','img','poll'].includes(q.t);

function qInput(q){
  if(isChoice(q))return `<div class="gts n${q.o.length} ${q.t} ${q.o.some(o=>String(o).length>32)?'long':''}">${q.o.map((o,i)=>tile(i,o,q)).join('')}</div>`;
  if(q.t==='type')return `<form class="gtype" id="gtype"><input id="gtypei" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort eingeben …" enterkeyhint="done"><button class="gbtn">OK</button></form>`;
  if(q.t==='order')return `<div class="gord"><div class="gordans" id="gordans"></div><div class="gchips" id="gordpool">${q.o.map((t,i)=>`<button class="gchip" data-i="${i}">${H(t)}</button>`).join('')}</div><button class="gbtn" id="gorddone" disabled>Fertig</button></div>`;
  if(q.t==='slider'){const mid=Math.round(((q.min+q.max)/2)/(q.step||1))*(q.step||1);
    return `<div class="gsl"><output id="gslv">${mid}${q.unit?' '+H(q.unit):''}</output><input type="range" id="gsl" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${mid}"><button class="gbtn" id="gsldone">OK</button></div>`}

function bindInput(box,q,done){
  if(isChoice(q)){box.querySelectorAll('.gt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.gt').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});b.classList.add('picked');done(+b.dataset.i)});return}
  if(q.t==='type'){const f=$('gtype'),i=$('gtypei'); setTimeout(()=>i&&i.focus(),50); f.onsubmit=ev=>{ev.preventDefault(); const v=i.value.trim(); if(!v)return; i.disabled=true; done(v)};return}
  if(q.t==='order'){const ans=$('gordans'),pool=$('gordpool'),btn=$('gorddone'),seq=[];
    const draw=()=>{ans.innerHTML=seq.map((k,j)=>`<button class="gchip" data-j="${j}">${H(q.o[k])}</button>`).join('');
      pool.querySelectorAll('.gchip').forEach(c=>c.classList.toggle('used',seq.includes(+c.dataset.i)));
      ans.querySelectorAll('.gchip').forEach(c=>c.onclick=()=>{seq.splice(+c.dataset.j,1);draw()}); btn.disabled=seq.length!==q.o.length};
    pool.querySelectorAll('.gchip').forEach(c=>c.onclick=()=>{const k=+c.dataset.i; if(!seq.includes(k)){seq.push(k);AU.sfx('flip');draw()}});
    btn.onclick=()=>{btn.disabled=true;done(seq.slice())};return}
  if(q.t==='slider'){const r=$('gsl'),o=$('gslv'); r.oninput=()=>o.textContent=r.value+(q.unit?' '+q.unit:''); $('gsldone').onclick=e=>{e.target.disabled=true;r.disabled=true;done(+r.value)}}
}
// runs one question for a single person; calls back with the answer and the seconds it took
function askQ(q,n,total,onAns){
  const box=gin(`${qHead(q,n,total)}<div class="gtimer"><i style="animation-duration:${q.dur}s"></i></div>${qCard(q)}${qInput(q)}<div id="gafter"></div>`);
  const t0=performance.now(); let fin=false;
  const ticks=[]; for(let s=5;s>=1;s--)if(q.dur>s)ticks.push(later(()=>AU.sfx('tick'),(q.dur-s)*1000));
  const done=v=>{ if(fin)return; fin=true; ticks.forEach(t=>{clearTimeout(t);TIMERS.delete(t)}); clearTimeout(to); TIMERS.delete(to);
    const tm=$('gm')&&$('gm').querySelector('.gtimer i'); if(tm)tm.style.animationPlayState='paused';
    onAns(v,(performance.now()-t0)/1000) };
  const to=later(()=>{ box.querySelectorAll('.gt,.gchip,input,button').forEach(b=>b.disabled=true); done(null)},q.dur*1000);
  bindInput(box,q,done);
}
function markTiles(q,v){
  if(!isChoice(q))return;

    if(q.t!=='poll'&&i===q.c){b.classList.add('right');b.classList.remove('dim')} else if(!b.classList.contains('picked'))b.classList.add('dim')});
}
function readyScreen(q,n,total,hist,ms,cb){
  const [lab,icn]=TYPES[q.t]||['Frage','help-circle'];

/* ---------- SOLO ---------- */
const setupKey=s=>[s.src,s.id||'',s.lvl||'',s.n,(s.types||[]).slice().sort().join('+'),s.speed||1].join('|');
async function soloStart(s){
  stage('Allein spielen'); gin(spinner(s.types&&s.types.includes('img')?'Fragen und Bilder werden vorbereitet …':'Fragen werden vorbereitet …'));
  const qs=await buildQs(s);
  if(!G||G.mode!=='solo-wait')return;      // left in the meantime
  if(!qs.length){gin(center(`<h2>Keine Fragen</h2><p>Mit dieser Auswahl lassen sich keine Fragen bilden. Nimm mehr Wörter oder andere Fragetypen.</p><a class="gbtn" href="#/play/solo">Zurück</a>`));return}
  const best=LS.get('gd_gbest',{})[setupKey(s)]||null;
  G={mode:'solo',kind:'solo',s,qs,n:0,score:0,streak:0,ok:0,hist:[],best,cum:[]};
  soloNext();
}
function soloScore(){setScore(`<span class="gscore">${fmt(G.score)}${G.best?`<small>Rekord ${fmt(G.best.score)}</small>`:''}</span>`)}
function soloNext(){
  if(G.n>=G.qs.length)return soloEnd();
  soloScore(); const q=G.qs[G.n];
  AU.play('calm');
  readyScreen(q,G.n,G.qs.length,G.hist,1600,()=>{ AU.play('think'); askQ(q,G.n,G.qs.length,(v,t)=>soloAnswer(q,v,t)) });
}
function soloAnswer(q,v,t){
  AU.halt();
  const r=judge(q,v,t);
  if(r.ok){G.streak++; r.pts+=streakBonus(G.streak); G.ok++; AU.sfx('ok')} else if(r.ok===false){G.streak=0; AU.sfx('bad')} else AU.sfx('send');
  G.score+=r.pts; G.hist.push({ok:r.ok,v}); G.cum.push(G.score); soloScore(); markTiles(q,v);
  const e=q.wi!=null?E[q.wi]:null, right=rightText(q);
  let ghost=''; if(G.best&&G.best.cum&&G.best.cum[G.n]!=null){const d=G.score-G.best.cum[G.n]; ghost=`<div class="gghost">${d>=0?'▲':'▼'} ${fmt(Math.abs(d))} ${d>=0?'vor':'hinter'} deinem Rekord</div>`}
  const last=G.n+1>=G.qs.length;
  $('gafter').innerHTML=`<div class="gres ${r.ok?'ok':r.ok===null?'poll':'bad'}">
    <h3>${r.ok?'Richtig!':r.ok===null?'Danke für deine Stimme':v==null?'Zeit abgelaufen':'Leider falsch'}</h3>
    ${r.ok?`<div class="pts">+${fmt(r.pts)}</div>`:''}${G.streak>=2?`<div class="gstreak">🔥 ${G.streak} richtig in Folge</div>`:''}
    ${!r.ok&&right?`<div class="ans">Richtig ist: <b>${H(right)}</b></div>`:''}
    ${e?`<div class="ans"><a href="#/w/${encodeURIComponent(e.w)}" target="_blank" rel="noopener">„${H(plainW(e.w))}" im Wörterbuch ansehen ↗</a></div>`:''}${ghost}
    <div class="row"><button class="gbtn" id="gnext">${last?'Ergebnis':'Weiter'} ${ic('arrow-right')}</button></div></div>`;
  drawIcons();
  G.n++;
  const nx=$('gnext'); nx.onclick=()=>{clearTimers();soloNext()}; nx.focus({preventScroll:true});
  if(r.ok)later(()=>{if(G&&G.mode==='solo')soloNext()},2600);
}
function soloEnd(){
  AU.stop(); setScore('');
  const key=setupKey(G.s), all=LS.get('gd_gbest',{}), prev=all[key], rec=!prev||G.score>prev.score;
  if(rec){all[key]={score:G.score,cum:G.cum,at:Date.now()}; LS.set('gd_gbest',all)}
  const miss=G.qs.map((q,k)=>({q,h:G.hist[k]})).filter(x=>x.h&&x.h.ok===false&&x.q.wi!=null);
  AU.sfx('fanfare'); if(rec||G.ok===G.qs.length)confetti();
  gin(center(`<div class="gend"><h2>${rec&&prev?'Neuer Rekord!':G.ok===G.qs.length?'Perfekt!':'Geschafft!'}</h2><div class="gbig">${fmt(G.score)}<small>Punkte</small></div></div>
    <div class="gstats"><div><b>${G.ok} / ${G.qs.filter(q=>q.t!=='poll').length}</b><span>richtig</span></div><div><b>${prev?fmt(Math.max(prev.score,G.score)):fmt(G.score)}</b><span>Rekord</span></div></div>
    ${miss.length?`<div class="gmiss"><h4>Diese Wörter üben</h4>${miss.map(x=>`<a href="#/w/${encodeURIComponent(E[x.q.wi].w)}"><b>${H(plainW(E[x.q.wi].w))}</b> – ${H(qGloss(E[x.q.wi])||'')}</a>`).join('')}</div>
      <button class="gbtn ghost" onclick="PLAY.saveMiss()">${ic('list-plus')} In Liste „Aus Spielen" speichern</button>`:''}
    <div class="row" style="justify-content:center;gap:.5rem"><button class="gbtn" onclick="PLAY.again()">${ic('rotate-ccw')} Nochmal</button><a class="gbtn ghost" href="#/play">Andere Spiele</a></div>`));
  G.miss=miss.map(x=>E[x.q.wi].w); G.mode='solo-end';
}
function saveMiss(){
  if(!G||!G.miss||!G.miss.length)return;
  let id=Object.keys(lists).find(k=>lists[k].name==='Aus Spielen');
  if(!id){id=uid();lists[id]={name:'Aus Spielen',words:[],created:now()}}

/* ---------- LIVE: connection (Supabase Realtime broadcast, no database needed) ---------- */
let SBP=null;
function loadSB(){ if(window.supabase&&window.supabase.createClient)return Promise.resolve();
  if(!SBP)SBP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
    s.onload=ok;s.onerror=()=>{SBP=null;no(new Error('net'))};document.head.appendChild(s)});
  return SBP }
let CLIENT=null;
async function openCh(pin,handlers){
  await loadSB();
  CLIENT=CLIENT||window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const ch=CLIENT.channel('wbq-'+pin,{config:{broadcast:{self:false,ack:false}}});
  for(const ev in handlers)ch.on('broadcast',{event:ev},m=>{try{handlers[ev](m.payload||{})}catch(e){console.error(e)}});
  await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('timeout')),12000);
    ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(t);ok()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(t);no(new Error(st))}})});
  return ch;
}
const send=(ev,p)=>{if(G&&G.ch)G.ch.send({type:'broadcast',event:ev,payload:p}).catch(()=>{})};
function closeCh(){ if(G&&G.ch){try{CLIENT.removeChannel(G.ch)}catch(e){} G.ch=null} }
const joinURL=pin=>location.origin+location.pathname+'#/play/join/'+pin;

/* ---------- LIVE: host (big screen) ---------- */
async function hostStart(s){
  stage('Live-Quiz',{fs:true}); gin(spinner('Spiel wird vorbereitet …'));
  const qs=await buildQs(s);
  if(!G||G.mode!=='host-wait')return;
  if(!qs.length){gin(center(`<h2>Keine Fragen</h2><p>Mit dieser Auswahl lassen sich keine Fragen bilden.</p><a class="gbtn" href="#/play/host">Zurück</a>`));return}
  const pin=String(100000+rnd(900000));
  G={mode:'host',kind:'host',s,qs,pin,n:-1,phase:'lobby',players:new Map(),kicked:new Set(),teams:+s.teams||0,ans:new Map(),title:s.title||'Live-Quiz'};
  try{ G.ch=await openCh(pin,{join:hJoin,ans:hAns,leave:hLeave}) }
  catch(e){ gin(center(`<h2>Keine Verbindung</h2><p>Der Spielserver ist gerade nicht erreichbar. Prüfe die Internetverbindung und versuche es noch einmal.</p><a class="gbtn" href="#/play/host">Zurück</a>`)); return }
  G.hb=setInterval(()=>send('hb',{phase:G.phase,n:G.n}),4000);
  hostLobby(); AU.play('lobby');
}
function teamFor(){const c=Array(G.teams).fill(0); G.players.forEach(p=>c[p.team-1]++); return c.indexOf(Math.min(...c))+1}
function hJoin(p){
  if(!G||G.mode!=='host'||!p.pid||G.kicked.has(p.pid))return;
  let pl=G.players.get(p.pid);
  if(!pl){ if(G.players.size>=80)return;
    let base=String(p.name||'Gast').replace(/\s+/g,' ').trim().slice(0,18)||'Gast', nm=base, k=2;
    const names=new Set([...G.players.values()].map(x=>x.name.toLowerCase())); while(names.has(nm.toLowerCase()))nm=base+' '+k++;
    pl={pid:p.pid,name:nm,av:AVS.includes(p.av)?p.av:AVS[rnd(AVS.length)],score:0,streak:0,ok:0,team:G.teams?teamFor():0,res:[],rank:0};
    G.players.set(p.pid,pl); AU.sfx('join');
  }
  send('welcome',{pid:pl.pid,name:pl.name,av:pl.av,team:pl.team,phase:G.phase,title:G.title,teams:G.teams});
  if(G.phase==='lobby')lobbyPlayers();
}
function hLeave(p){ if(!G||G.mode!=='host')return; if(G.phase==='lobby'&&G.players.delete(p.pid))lobbyPlayers() }
function kick(pid){ if(!G||G.mode!=='host')return; G.players.delete(pid); G.kicked.add(pid); send('kick',{pid}); lobbyPlayers() }

let QRP=null;
function qr(el,text){ if(!el)return;

function hostGo(){ if(!G||G.mode!=='host'||!G.players.size)return; hostNext() }
function hostNext(){

  const t0=Date.now();

function hAns(p){

function ranking(){ const ps=[...G.players.values()].sort((a,b)=>b.score-a.score); ps.forEach((p,k)=>{p.prev=p.rank||k+1;p.rank=k+1}); return ps }
function teamScores(){ return TEAMS.slice(0,G.teams).map((t,k)=>{const m=[...G.players.values()].filter(p=>p.team===k+1);

/* ---------- LIVE: player (phone) ---------- */

      <input id="gname" maxlength="18" placeholder="Dein Name" value="${A(saved.name)}" autocomplete="nickname">
      <div class="gavs">${AVS.slice(0,16).map(a=>`<button type="button" data-a="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div>
      <button class="gbtn" style="justify-content:center">${ic('log-in')} Los geht's</button>

  const f=$('gjf');

  $('gnm').onclick=()=>{$('gname').value=NAMES[rnd(NAMES.length)]};

    const p=$('gpin').value.replace(/\D/g,''), n=$('gname').value.trim();
    if(p.length!==6){joinForm(p,'Die PIN hat 6 Ziffern.');return}
    if(!n){$('gname').focus();return}

async function playerJoin(pin,name,av){
  const prev=LS.get('gd_gjoin',null);
  const pid=prev&&prev.pin===pin&&Date.now()-prev.at<3*3600e3?prev.pid:uid()+uid();
  G={mode:'player',pin,pid,name,av,joined:false,last:Date.now(),score:0,q:null};
  stage('Spiel '+pin.slice(0,3)+' '+pin.slice(3)); gin(spinner('Verbinde mit dem Spiel …'));
  try{ G.ch=await openCh(pin,{welcome:pWelcome,kick:pKick,ready:pReady,q:pQ,count:pCount,reveal:pReveal,scores:()=>{},end:pEnd,hb:pHb,lobby:pLobby,bye:pBye}) }
  catch(e){ if(G&&G.mode==='player')joinForm(pin,'Keine Verbindung zum Spielserver. Bitte noch einmal versuchen.'); return }
  let tries=0;
  const tryJoin=()=>{ if(!G||G.mode!=='player'||G.joined)return; if(tries++>=5){closeCh();joinForm(pin,'Kein laufendes Spiel mit dieser PIN gefunden.');return}
    send('join',{pid,name,av}); later(tryJoin,2200) };
  tryJoin();
  G.watch=setInterval(()=>{ if(!G||G.mode!=='player'||!G.joined)return; const off=Date.now()-G.last>15000, m=$('gm');
    let b=m&&m.querySelector('.goff'); if(off&&!b&&m){b=document.createElement('div');b.className='goff';b.textContent='Verbindung unterbrochen …';m.appendChild(b)} else if(!off&&b)b.remove() },3000);
}
const mine=p=>p&&p.pid===G.pid;
const alive=()=>{if(G)G.last=Date.now()};
function pWelcome(p){ if(!G||G.mode!=='player'||!mine(p))return; alive();
  const first=!G.joined; G.joined=true; G.name=p.name; G.team=p.team; G.title=p.title;
  LS.set('gd_gjoin',{pin:G.pin,pid:G.pid,at:Date.now()});
  if(first){AU.sfx('join'); if(p.phase==='lobby'||p.phase==='end')pWait(); else gin(center(`<div class="gme">${G.av}</div><h2>Du bist dabei!</h2><p>Bei der nächsten Frage geht es los.</p>`))}
}
function pWait(){
  gin(center(`<div class="gme">${G.av}</div><h2>Du bist dabei, ${H(G.name)}!</h2><p>Siehst du deinen Namen auf dem großen Bildschirm?</p>
    ${G.team?`<div class="gpl" style="cursor:default"><span class="tm t${G.team}">${ic(TEAMS[G.team-1][1])}</span> Team ${TEAMS[G.team-1][0]}</div>`:''}<p style="opacity:.7">Warte, bis die Spielleitung startet …</p>`));
}
function pLobby(){ if(!G||G.mode!=='player'||!G.joined)return; alive(); G.score=0; pWait() }
function pKick(p){ if(!G||G.mode!=='player'||!mine(p))return; closeCh(); LS.set('gd_gjoin',null); G.mode='player-out';
  gin(center(`<h2>Du wurdest aus dem Spiel entfernt</h2><a class="gbtn" href="#/play">Zu den Spielen</a>`)) }
function pBye(){ if(!G||G.mode!=='player')return; closeCh(); G.mode='player-out'; gin(center(`<h2>Die Spielleitung hat das Spiel beendet</h2><a class="gbtn" href="#/play">Zu den Spielen</a>`)) }
function pHb(p){ if(!G||G.mode!=='player')return; alive() }
function pReady(p){ if(!G||G.mode!=='player'||!G.joined)return; alive(); clearTimers();
  const [lab,icn]=TYPES[p.t]||['Frage','help-circle'];
  gin(center(`<div class="gready"><div class="gnum">${p.n+1}</div></div><div class="gtyp">${ic(icn)} ${lab}${p.dbl?' · doppelte Punkte!':''}</div><p>Schau nach vorne – gleich geht's los!</p>`));
}
function pQ(q){ if(!G||G.mode!=='player'||!G.joined)return; alive(); clearTimers(); G.q=q; G.sent=false;
  askQ(q,q.n,q.total,(v)=>{ if(G.sent)return; G.sent=true;
    if(v!=null){send('ans',{pid:G.pid,n:q.n,v}); AU.sfx('send')}
    later(()=>{ if(G&&G.q===q&&G.mode==='player')gin(center(`<div class="gspin"></div><h2>${v==null?'Zeit abgelaufen':'Antwort ist raus!'}</h2><p id="gpc">Warte auf die anderen …</p>`)) },v==null?0:500);
  });

function pCount(p){ alive(); const c=$('gpc'); if(c&&p)c.textContent=`${p.a} von ${p.of} haben geantwortet …`}
function pReveal(p){ if(!G||G.mode!=='player'||!G.joined)return; alive(); clearTimers();
  const r=p.res&&p.res[G.pid]; if(!r){gin(center(`<h2>Gleich bist du dabei</h2><p>Ab der nächsten Frage zählen deine Punkte.</p>`));return}

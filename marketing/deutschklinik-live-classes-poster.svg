  <g font-family="Arial,Helvetica,sans-serif" fill="#20242b"><text x="126" y="790" font-size="27" font-weight="700">LEARN AT YOUR PACE</text><text x="126" y="842" font-size="31">Vocabulary · grammar · flashcards · games</text><text x="126" y="894" font-size="31">Your progress, saved in one learner account.</text></g>

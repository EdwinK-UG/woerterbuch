<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wunschzauber mit Liv</title>
<link rel="icon" href="../../favicon.svg?v=3">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a2f3a; --muted: #6b6f78; --gold: #b07a12; --green: #2f7d5b; --coral: #c8503d; --paper: #fffcf6; --night: #2b2a4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #3a3863; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .ui { position: fixed; left: 0; right: 0; pointer-events: none; padding: 14px 18px; }
  .ui > * { pointer-events: auto; }
  header.ui { top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .title { background: rgba(255,252,246,.9); border-radius: 14px; padding: 8px 14px; }
  .kicker { font-size: 11px; letter-spacing: .08em; color: var(--gold); font-weight: 600; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 28px; margin: 2px 0 0; }
  .round { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; font-size: 15px; border: 0; border-radius: 12px; padding: 10px 16px; background: #fff; color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.12); cursor: pointer; min-height: 42px; }
  button:hover:not(:disabled) { background: #f4efe6; }
  button.on { background: var(--gold); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid #f1c64c; outline-offset: 2px; }
  footer.ui { bottom: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .wish { background: rgba(255,252,246,.95); border-radius: 16px; padding: 10px 16px; font-size: 22px; line-height: 1.5; max-width: 980px; box-shadow: 0 4px 18px rgba(20,10,40,.25); }
  .wish:empty { display: none; }
  .wish .hint { display: block; font-size: 12px; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  .gap { display: inline-block; min-width: 3.6em; border-bottom: 3px dashed #c9a24a; text-align: center; color: transparent; border-radius: 6px; transition: background .3s, color .3s; }
  .gap.now { background: #fff1c9; animation: pulse 1.2s ease-in-out infinite; }
  .gap.done { color: var(--gold); border-bottom-color: transparent; font-weight: 600; background: #fff6dc; }
  .form b { font-weight: 600; } .form .u { color: #d9622b; } .form .e { color: var(--green); }
  .form small { display: inline-block; font-size: 12px; color: var(--muted); margin-left: 8px; }
  @keyframes pulse { 50% { background: #ffe39a; } }
  .caption { background: rgba(255,252,246,.92); border-radius: 14px; padding: 8px 14px; font-size: 16px; line-height: 1.4; max-width: 980px; }
  .caption b.ok { color: var(--green); } .caption b.no { color: var(--coral); }
  .caption:empty { display: none; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .choices button { font-weight: 600; min-width: 92px; }
  .score { font-size: 15px; color: #fff3cf; font-weight: 600; margin-left: 4px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(43,42,74,.55); backdrop-filter: blur(3px); z-index: 5; }
  #start .card { background: var(--paper); border-radius: 20px; padding: 26px 28px; max-width: 440px; margin: 16px; text-align: center; box-shadow: 0 10px 40px rgba(20,10,40,.35); }
  #start h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; margin: 0 0 8px; font-size: 26px; }
  #start p { color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
  #start .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #start button { font-size: 17px; padding: 12px 20px; }
  #start button.main { background: var(--gold); color: #fff; }
  .hint2 { font-size: 12px; color: var(--muted); margin-top: 12px; }
  @media (max-aspect-ratio: 9/10) {
    h1 { font-size: 20px; }
    header.ui { flex-direction: column; padding: 10px 12px; }
    .seg { justify-content: flex-start; }
    .wish { font-size: 17px; padding: 8px 12px; }
    .caption { font-size: 14px; }
    button { font-size: 14px; padding: 8px 11px; min-height: 38px; }
    footer.ui { padding: 10px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { #start { backdrop-filter: none; } .gap.now { animation: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
               "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.min.js" } }
</script>
</head>
<body>
<canvas id="scene" aria-label="Abendwiese: Liv, ein Mädchen im roten Dirndl, hält einen Zauberstab. Um sie schweben leuchtende Wortkugeln."></canvas>
<header class="ui">
  <div class="title">
    <div class="kicker">B2 · KAPITEL 9 · KONJUNKTIV II</div>
    <h1>Wünsch dir was!</h1>
    <div class="round" id="round"></div>
  </div>
  <div class="seg">
    <button id="watch" class="on">Zuschauen</button>
    <button id="try">Selbst zaubern</button>
    <button id="sound" aria-pressed="true">Ton an</button>
    <button id="close" aria-label="Schließen">✕</button>
  </div>
</header>
<footer class="ui">
  <div class="wish" id="wish" aria-live="polite"></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="controls"><span class="controls choices" id="choices"></span><span class="controls" id="controls"></span><span class="score" id="score"></span></div>
</footer>
<div id="start">
  <div class="card">
    <h2>Wenn ich einen Zauberstab hätte …</h2>
    <p>Liv hat einen! Jeder Wunsch braucht den Konjunktiv II. Schwing den Stab zum richtigen Wort – oder schau Liv zuerst zu.</p>
    <div class="row"><button id="goWatch" disabled>Lädt …</button><button id="goTry" class="main" disabled>Selbst zaubern</button></div>
    <div class="hint2">Wischen: Stab schwingen · Tippen oder 1 2 3: Wort wählen · → Weiter</div>
  </div>
</div>
<script type="module" src="main.js?v=2"></script>
</body>
</html>

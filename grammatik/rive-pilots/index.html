<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Deutschklinik · Rive Grammatik</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="runtime/rive.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <span class="brand">Deutschklinik</span>
    <span class="edition">Die Bergwinkler Nachrichten</span>
  </header>
  <main>
    <button type="button" id="close-pilot" class="quiet">← Zurück zum Kapitel</button>
    <div class="heading">
      <span id="topic"></span>
      <h1 id="title"></h1>
      <p id="intro"></p>
    </div>
    <div class="layout">
      <section class="player" aria-label="Rive Lernszene">
        <div class="stage" id="stage" data-room="shop" data-prop="bag">
          <span class="place" id="place"></span>
          <div class="wall-window" aria-hidden="true"></div>
          <div class="shelf" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="actor-bank" id="actors" aria-hidden="true"></div>
          <div class="prop" id="prop" aria-hidden="true"></div>
          <div class="stage-words" id="stage-words"></div>
        </div>
        <div class="caption">
          <b id="speaker"></b>
          <p id="caption"></p>
        </div>
        <div id="video-controls">
          <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Position im Erklärfilm">
          <div class="control-row">
            <div class="transport">
              <button type="button" id="play">Abspielen</button>
              <button type="button" id="previous" class="quiet" aria-label="Vorherige Szene">←</button>
              <button type="button" id="next" class="quiet" aria-label="Nächste Szene">→</button>
              <span id="time"></span>
            </div>
            <button type="button" id="practice">Jetzt üben →</button>
          </div>
        </div>
        <div id="exercise" hidden>
          <div id="exercise-content" tabindex="-1"></div>
          <p id="feedback" aria-live="polite"></p>
          <button type="button" id="back" class="quiet">← Zum Erklärfilm</button>
        </div>
      </section>
      <aside class="lesson-notes">
        <h2>Szenen</h2>
        <ol id="scenes"></ol>
        <details>
          <summary>Merken</summary>
          <p id="reference"></p>
        </details>
        <p id="audio-status" aria-live="polite">Sprachaufnahmen werden geladen …</p>
      </aside>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenas Umzug auf dem Zeitband – Futur II</title>
<link rel="icon" href="../../favicon.svg?v=7">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.49.0/rive.js" as="script" crossorigin>
<script src="../../config.js"></script>
<link rel="stylesheet" href="../buehne/stage.css?v=7">
<link rel="modulepreload" href="main.js?v=7">
<link rel="modulepreload" href="../buehne/stage.js?v=7">
</head>
<body>
<div id="app">
  <div id="stage" aria-label="Umzugstag: Antons Werkstatt und Lenas neue Wohnung voller Kisten. Ein leuchtendes Zeitband liegt auf dem Boden; Vermutungen erscheinen als durchsichtige Blasen.">
    <canvas id="bg"></canvas>
    <div id="people"></div>
    <canvas id="fg"></canvas>
    <div id="cards" aria-live="polite"></div>
    <div id="wheel" aria-live="polite"></div>
    <div id="merk" aria-live="polite"></div>
    <div id="corner"><button id="sound" aria-pressed="true" title="Ton an/aus" aria-label="Ton an">🔊</button><button id="full" title="Vollbild" aria-label="Vollbild">⛶</button></div>
    <div id="start"><div class="box">
      <h2>Lenas Umzug auf dem Zeitband</h2>
      <p>Futur II: Vermutungen und was bis dann fertig ist.</p>
      <div class="row"><button id="goWatch" class="main" disabled>▶ Zuschauen</button><button id="goTry" disabled>Mitspielen</button></div>
      <div id="load">Lädt …</div>
    </div></div>
  </div>
  <div id="panel">
    <div id="cap" aria-live="polite"></div>
    <div id="practice">
      <div id="prompt"></div>
      <div id="verdict" aria-live="polite"></div>
    </div>
    <div id="strip" aria-live="polite"></div>
    <div id="practice2">
      <div id="answers"></div>
      <div id="say"><input id="inp" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Schreib den Satz …" aria-label="Deine Antwort"><button id="ok" class="main">OK</button></div>
    </div>
    <div id="ctl">
      <button id="prev" aria-label="Szene zurück">⏮</button><button id="play" aria-label="Pause">❚❚</button><button id="next" aria-label="Nächste Szene">⏭</button>
      <div id="dots"></div>
      <button id="try" class="main">Mitspielen</button><span id="score"></span>
    </div>
  </div>
</div>
<script type="module" src="main.js?v=7"></script>
</body>
</html>

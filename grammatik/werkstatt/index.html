<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trennbar-Werkstatt 3D</title>
<link rel="icon" href="../../favicon.svg?v=3">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a2f3a; --muted: #6b6f78; --green: #2f7d5b; --coral: #c8503d; --paper: #fffcf6; --line: #e4d9c6; --bg: #f3e9d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; left: 0; right: 0; pointer-events: none; padding: 14px 18px; }
  .ui > * { pointer-events: auto; }
  header.ui { top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .kicker { font-size: 11px; letter-spacing: .08em; color: var(--green); font-weight: 600; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 30px; margin: 2px 0 0; }
  .round { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; font-size: 15px; border: 0; border-radius: 12px; padding: 10px 16px; background: #fff; color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.08); cursor: pointer; min-height: 42px; }
  button:hover:not(:disabled) { background: #f4efe6; }
  button.on { background: var(--green); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid #f1c64c; outline-offset: 2px; }
  footer.ui { bottom: 0; display: flex; flex-direction: column; gap: 10px; }
  .caption { background: rgba(255,252,246,.94); border-radius: 14px; padding: 10px 14px; font-size: 16px; line-height: 1.4; max-width: 980px; min-height: 22px; box-shadow: 0 2px 10px rgba(80,60,30,.08); }
  .caption b.ok { color: var(--green); } .caption b.no { color: var(--coral); }
  .caption:empty { display: none; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .score { font-size: 15px; color: var(--green); font-weight: 600; margin-left: 6px; }
  .shelfmini { display: none; gap: 8px; font-size: 13px; }
  .shelfmini div { background: rgba(255,252,246,.94); border-radius: 12px; padding: 6px 10px; flex: 1; }
  .shelfmini b { display: block; font-size: 11px; letter-spacing: .06em; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(243,233,216,.72); backdrop-filter: blur(3px); z-index: 5; }
  #start .card { background: var(--paper); border-radius: 20px; padding: 26px 28px; max-width: 420px; margin: 16px; text-align: center; box-shadow: 0 10px 40px rgba(80,60,30,.15); }
  #start h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; margin: 0 0 8px; font-size: 26px; }
  #start p { color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
  #start button { background: var(--green); color: #fff; font-size: 17px; padding: 12px 22px; }
  .hint { font-size: 12px; color: var(--muted); }
  @media (max-aspect-ratio: 9/10) {
    h1 { font-size: 22px; }
    header.ui { flex-direction: column; }
    .seg { justify-content: flex-start; }
    .caption { font-size: 14px; }
    button { font-size: 14px; padding: 9px 12px; }
    .shelfmini { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) { #start { backdrop-filter: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="scene" aria-label="3D-Werkstatt: Ein junger Mann in Flanellhemd versucht, Verben mit einer Säge zu teilen."></canvas>
<header class="ui">
  <div>
    <div class="kicker">B1 · KAPITEL 57 · VERBEN 3</div>
    <h1>Trennbar oder untrennbar?</h1>
    <div class="round" id="round">Runde 1 / 8</div>
  </div>
  <div class="seg">
    <button id="watch" class="on">Zuschauen</button>
    <button id="try">Selbst sägen</button>
    <button id="sound" aria-pressed="true">Ton an</button>
  </div>
</header>
<footer class="ui">
  <div class="shelfmini" id="shelfmini"><div><b style="color:#2f7d5b">TRENNBAR</b><span id="sepList">–</span></div><div><b style="color:#41536b">UNTRENNBAR</b><span id="insList">–</span></div></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="controls" id="controls"></div>
</footer>
<div id="start">
  <div class="card">
    <h2>Die Säge zeigt es</h2>
    <p>Trennbare Verben lassen sich teilen, untrennbare nicht. Mit Ton: Motor, Säge, Klonk!</p>
    <button id="go" disabled>Lädt …</button>
    <div class="hint" style="margin-top:12px">Tasten: S = Sägen · G = Ganz einbauen · → Weiter · Leertaste Pause</div>
  </div>
</div>
<script type="module" src="main.js?v=2"></script>
</body>
</html>

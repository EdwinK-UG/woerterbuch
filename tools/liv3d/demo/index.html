<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liv 3D player</title>
<style>
  :root { --bg: #f3e9d8; --ink: #3a1c0c; --panel: rgba(255, 250, 240, 0.92); --btn: #fffaf2; --on: #d9622b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.3 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; top: 8px; left: 8px; bottom: 8px; width: 330px; overflow: auto; background: var(--panel); border-radius: 10px; padding: 8px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  #ui h2 { font-size: 12px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
  #ui button { margin: 2px; padding: 4px 7px; border: 1px solid #c9b18f; border-radius: 6px; background: var(--btn); color: var(--ink); cursor: pointer; font: inherit; }
  #ui button:hover { border-color: var(--on); }
  #ui button.on { background: var(--on); color: #fff; border-color: var(--on); }
  #status { position: fixed; right: 10px; bottom: 8px; font: 12px ui-monospace, monospace; opacity: .75; white-space: pre; text-align: right; }
  #hide { position: fixed; top: 8px; right: 8px; }
  @media (max-width: 700px) { #ui { width: auto; right: 8px; bottom: auto; max-height: 45vh; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><b>Liv 3D</b> <span id="model"></span><div id="panels"></div></div>
<div id="status">loading…</div>
<script type="module" src="./demo.js"></script>
</body>
</html>
